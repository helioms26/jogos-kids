<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5B4BE0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Mundo dos Jogos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎈</text></svg>">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --roxo:#5B4BE0; --roxo2:#8B7CF6;
    --amarelo:#FFC93C; --verde:#2FBF71; --vermelho:#FF5D5D;
    --azul:#3AA3F5; --rosa:#FF7BC1; --laranja:#FF9448;
    --fundo:#F4F1FF; --escuro:#2C2350;
    --raio:26px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; font-family:"Baloo 2",'Comic Sans MS','Trebuchet MS',system-ui,-apple-system,sans-serif;
    background:var(--fundo); color:var(--escuro);
    overscroll-behavior:none; touch-action:manipulation;
    user-select:none;-webkit-user-select:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    display:flex; flex-direction:column; min-height:100dvh; overflow-x:hidden;
  }
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}

  .tela{display:none; flex:1; flex-direction:column; min-height:0}
  .tela.ativa{display:flex}

  /* ---------- capa ---------- */
  #capa{
    align-items:center; justify-content:center; text-align:center; gap:6px; padding:20px;
    background:linear-gradient(160deg,#6C5CE7,#8B7CF6 45%,#3AA3F5); color:#fff;
  }
  #capa h1{font-size:clamp(34px,10vw,64px); margin:0; line-height:1.05; text-shadow:0 6px 0 rgba(0,0,0,.15)}
  #capa p{font-size:clamp(15px,4.2vw,20px); opacity:.92; margin:4px 0 22px; max-width:22ch}
  .btn-grande{
    background:var(--amarelo); color:#5a3d00; font-size:clamp(22px,6.5vw,30px); font-weight:800;
    padding:20px 42px; border-radius:999px; box-shadow:0 8px 0 #d99f00, 0 14px 26px rgba(0,0,0,.25);
    transition:transform .08s, box-shadow .08s;
  }
  .btn-grande:active{transform:translateY(6px); box-shadow:0 2px 0 #d99f00}
  .emojizinhos{font-size:clamp(30px,9vw,46px); letter-spacing:6px; margin-bottom:6px}

  /* ---------- idades ---------- */
  #idades{padding:18px 14px 24px; align-items:center; justify-content:center; gap:16px}
  #idades h2{margin:0 0 4px; font-size:clamp(22px,6vw,32px); text-align:center}
  .idade{
    width:100%; max-width:520px; border-radius:var(--raio); padding:22px 18px; color:#fff; text-align:left;
    display:flex; align-items:center; gap:16px;
    box-shadow:0 8px 0 rgba(0,0,0,.18), 0 12px 24px rgba(0,0,0,.12);
    transition:transform .1s, box-shadow .1s;
  }
  .idade:active{transform:translateY(5px); box-shadow:0 3px 0 rgba(0,0,0,.18)}
  .idade .ico{font-size:clamp(42px,13vw,60px); line-height:1; flex:0 0 auto}
  .idade .txt{flex:1}
  .idade .nome{font-size:clamp(20px,5.6vw,26px); font-weight:800; display:block}
  .idade .desc{font-size:clamp(13px,3.6vw,15px); opacity:.92; line-height:1.3}
  .ip{background:linear-gradient(150deg,#FF7BC1,#E5468F)}
  .ig{background:linear-gradient(150deg,#3AA3F5,#1E6FD9)}

  /* ---------- menu ---------- */
  #menu{padding:14px 14px 22px}
  .topo{display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:8px; margin-bottom:12px}
  .topo h2{margin:0; font-size:clamp(16px,4.4vw,24px); min-width:0; white-space:nowrap;
           overflow:hidden; text-overflow:ellipsis}
  .topo-dir{display:flex; align-items:center; gap:6px; justify-self:end}
  .cartoes{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr)); gap:12px;
    flex:1; align-content:center; width:100%; max-width:820px; margin:0 auto;
  }
  .cartao{
    border-radius:var(--raio); padding:16px 12px; color:#fff; text-align:center;
    box-shadow:0 8px 0 rgba(0,0,0,.18), 0 12px 24px rgba(0,0,0,.12);
    display:flex; flex-direction:column; align-items:center; gap:6px; min-height:142px; justify-content:center;
    transition:transform .1s, box-shadow .1s;
  }
  .cartao:active{transform:translateY(5px); box-shadow:0 3px 0 rgba(0,0,0,.18)}
  .cartao .ico{font-size:clamp(34px,10vw,50px); line-height:1}
  .cartao .nome{font-size:clamp(15px,4.2vw,19px); font-weight:800; line-height:1.15}
  .cartao .desc{font-size:12.5px; opacity:.92; line-height:1.25}
  .c1{background:linear-gradient(150deg,#FF7BC1,#E5468F)}
  .c2{background:linear-gradient(150deg,#3AA3F5,#1E6FD9)}
  .c3{background:linear-gradient(150deg,#2FBF71,#159B58)}
  .c4{background:linear-gradient(150deg,#FF9448,#EA6A1B)}
  .c5{background:linear-gradient(150deg,#8B7CF6,#5B4BE0)}
  .c6{background:linear-gradient(150deg,#FFC93C,#E09A00)}

  /* ---------- barra ---------- */
  .barra{
    display:flex; align-items:center; gap:8px; padding:10px 12px;
    background:#fff; border-bottom:3px solid rgba(0,0,0,.06); position:sticky; top:0; z-index:5;
  }
  .btn-icone{
    width:50px; height:50px; border-radius:18px; background:#EDE9FF; color:var(--roxo);
    font-size:24px; display:flex; align-items:center; justify-content:center; font-weight:800; flex:0 0 auto;
  }
  .btn-icone:active{background:#ddd6ff}
  .titulo-jogo{flex:1; font-size:clamp(15px,4.2vw,20px); font-weight:800; text-align:center; line-height:1.15}
  .placar{
    background:#FFF4D1; color:#8a6100; font-weight:800; border-radius:16px; padding:8px 12px;
    font-size:clamp(14px,4vw,18px); white-space:nowrap;
  }
  .progresso{height:10px; background:#E6E1FA}
  .progresso i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--verde),#7BE3AE); transition:width .3s}

  /* ---------- palco ---------- */
  .palco{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:space-evenly;
    gap:10px; padding:16px 14px 26px; min-height:0; text-align:center;
  }
  .pergunta{font-size:clamp(19px,5vw,30px); font-weight:800; line-height:1.25; max-width:26ch}
  .subtexto{font-size:clamp(13px,3.6vw,17px); opacity:.65; margin-top:-4px}
  .destaque{
    font-size:min(26vw,22vh,170px); font-weight:900; line-height:1;
    color:var(--roxo); text-shadow:0 6px 0 rgba(91,75,224,.18);
  }
  .destaque.pequeno{font-size:min(20vw,18vh,130px)}
  .conta{
    font-size:min(15vw,11vh,86px); font-weight:900; color:var(--roxo); line-height:1.1;
    text-shadow:0 5px 0 rgba(91,75,224,.16); letter-spacing:2px;
  }
  .contagem{
    display:grid; gap:6px 10px; justify-items:center; align-items:center;
    max-width:min(92vw,560px); font-size:min(13vw,8vh,68px); line-height:1;
  }
  .contagem span{animation:pop .3s backwards}
  @keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
  .grupos{display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center;
          font-size:min(11vw,7vh,54px); line-height:1.1}
  .grupos .mais{font-size:min(9vw,6vh,44px); font-weight:900; color:var(--roxo)}
  .grupos .caixa{background:#fff; border-radius:20px; padding:10px 12px; box-shadow:0 5px 0 rgba(0,0,0,.1);
                 max-width:min(40vw,220px); line-height:1.15}

  .sequencia{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; align-items:center;
             font-size:min(11vw,7vh,56px)}
  .sequencia .item{background:#fff; border-radius:18px; padding:6px 10px; box-shadow:0 4px 0 rgba(0,0,0,.1); min-width:1.4em}
  .sequencia .item.num{font-size:min(8vw,5vh,40px); font-weight:900; color:var(--escuro)}
  .sequencia .vazio{background:#EDE9FF; color:var(--roxo); font-weight:900}

  .opcoes{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; width:100%; max-width:620px}
  .op{
    background:#fff; border-radius:var(--raio); box-shadow:0 6px 0 rgba(0,0,0,.12), 0 10px 20px rgba(0,0,0,.08);
    min-width:104px; min-height:min(28vw,110px); flex:1 1 104px; max-width:190px;
    display:flex; align-items:center; justify-content:center; padding:12px;
    font-size:min(13vw,8vh,70px); font-weight:900; color:var(--escuro);
    transition:transform .1s, box-shadow .1s;
  }
  .op:active{transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.12)}
  .op.certo{background:#D6F7E6; box-shadow:0 6px 0 #2FBF71; animation:tada .5s}
  .op.errado{background:#FFE0E0; box-shadow:0 6px 0 #FF5D5D; animation:tremer .4s}
  .op.apagado{opacity:.35}
  .op svg{width:min(18vw,10vh,100px); height:min(18vw,10vh,100px)}
  .opcoes.num .op{font-size:min(11vw,7vh,54px); min-height:min(22vw,92px)}
  .opcoes.texto{max-width:640px}
  .opcoes.texto .op{
    flex:1 1 44%; max-width:none; min-height:68px; padding:14px 12px;
    font-size:clamp(15px,4.2vw,21px); font-weight:800; line-height:1.25; text-align:center; word-break:break-word;
  }
  @keyframes tada{0%{transform:scale(1)}30%{transform:scale(1.16) rotate(-4deg)}60%{transform:scale(1.16) rotate(4deg)}100%{transform:scale(1)}}
  @keyframes tremer{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}

  /* ---------- anagrama ---------- */
  .montada{
    display:flex; gap:6px; flex-wrap:wrap; justify-content:center; min-height:64px; align-items:center;
  }
  .montada .slot{
    width:clamp(34px,9vw,52px); height:clamp(46px,12vw,66px); border-radius:14px; background:#EDE9FF;
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(20px,5.5vw,32px); font-weight:900; color:var(--roxo);
  }
  .montada .slot.cheio{background:#fff; box-shadow:0 4px 0 rgba(0,0,0,.12); color:var(--escuro)}
  .letras{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; max-width:600px}
  .letra{
    width:clamp(44px,12vw,66px); height:clamp(52px,14vw,74px); border-radius:16px; background:#fff;
    box-shadow:0 5px 0 rgba(0,0,0,.14); font-size:clamp(22px,6vw,34px); font-weight:900;
    display:flex; align-items:center; justify-content:center; transition:transform .1s, opacity .15s;
  }
  .letra:active{transform:translateY(4px)}
  .letra.usada{opacity:.25; pointer-events:none}
  .btn-apagar{background:#EDE9FF; color:var(--roxo); font-weight:800; border-radius:999px;
              padding:12px 22px; font-size:clamp(15px,4vw,18px); box-shadow:0 5px 0 rgba(0,0,0,.1)}

  /* ---------- corrida ---------- */
  .pista{width:100%; max-width:600px; display:flex; flex-direction:column; gap:10px}
  .faixa{
    position:relative; height:clamp(58px,15vw,84px); border-radius:22px; overflow:hidden;
    background:#fff; box-shadow:0 5px 0 rgba(0,0,0,.1);
  }
  .faixa.eu{background:linear-gradient(90deg,#EDE9FF,#fff)}
  .faixa .chegada{position:absolute; right:8px; top:6px; bottom:6px; width:12px; border-radius:4px;
    background:repeating-linear-gradient(45deg,#2C2350 0 6px,#fff 6px 12px)}
  .faixa .veiculo{position:absolute; top:50%; transform:translate(-50%,-50%);
    font-size:clamp(28px,8vw,44px); transition:left .12s linear}
  .faixa .quem{position:absolute; left:10px; top:6px; font-size:12px; font-weight:800; opacity:.5}
  .btn-turbo{
    background:var(--amarelo); color:#5a3d00; font-size:clamp(20px,6vw,28px); font-weight:900;
    padding:22px 44px; border-radius:999px; box-shadow:0 8px 0 #d99f00; width:min(90%,420px);
  }
  .btn-turbo:active{transform:translateY(6px); box-shadow:0 2px 0 #d99f00}

  /* ---------- quebra-cabeça ---------- */
  .puzzle{
    display:grid; gap:4px; width:min(88vw,52vh,420px); aspect-ratio:1/1;
    background:#fff; padding:6px; border-radius:22px; box-shadow:0 6px 0 rgba(0,0,0,.12);
  }
  .peca{background-repeat:no-repeat; border-radius:8px; transition:transform .12s, outline-color .12s;
        outline:4px solid transparent; outline-offset:-4px}
  .peca.sel{outline-color:var(--roxo); transform:scale(.9)}
  .miniatura{width:clamp(56px,16vw,88px); border-radius:12px; box-shadow:0 4px 0 rgba(0,0,0,.12)}

  /* ---------- mira ---------- */
  .arena{
    position:relative; width:100%; max-width:600px; flex:1; min-height:min(58vh,430px);
    background:linear-gradient(160deg,#E8F4FF,#fff); border-radius:24px; overflow:hidden;
    box-shadow:inset 0 0 0 4px rgba(91,75,224,.08);
  }
  .alvo{
    position:absolute; transform:translate(-50%,-50%) scale(0); font-size:clamp(44px,13vw,72px);
    transition:transform .16s ease-out; line-height:1;
  }
  .alvo.entrou{transform:translate(-50%,-50%) scale(1)}
  .alvo.pequeno{font-size:clamp(34px,10vw,56px)}

  /* ---------- memoria ---------- */
  .grade{display:grid; gap:10px; width:100%; max-width:min(460px,58vh); margin:auto}
  .carta{position:relative; aspect-ratio:1/1; perspective:700px}
  .carta .face{
    position:absolute; inset:0; border-radius:20px; display:flex; align-items:center; justify-content:center;
    font-size:min(9vw,7vh,46px); backface-visibility:hidden; -webkit-backface-visibility:hidden;
    transition:transform .35s; box-shadow:0 5px 0 rgba(0,0,0,.14);
  }
  .carta .costas{background:linear-gradient(150deg,var(--roxo2),var(--roxo)); color:#fff}
  .carta .frente{background:#fff; transform:rotateY(180deg)}
  .carta.virada .costas{transform:rotateY(180deg)}
  .carta.virada .frente{transform:rotateY(360deg)}
  .carta.achada .frente{background:#D6F7E6; box-shadow:0 5px 0 #2FBF71}
  .carta.achada{animation:tada .5s}

  /* ---------- feedback / fim ---------- */
  .aviso{
    position:fixed; left:50%; top:14%; transform:translate(-50%,-20px); z-index:20;
    background:#fff; padding:14px 26px; border-radius:999px; font-size:clamp(19px,5vw,27px); font-weight:900;
    box-shadow:0 10px 30px rgba(0,0,0,.2); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
    max-width:88vw; text-align:center;
  }
  .aviso.mostra{opacity:1; transform:translate(-50%,0)}
  .aviso.bom{color:var(--verde)} .aviso.ops{color:var(--vermelho)}

  #fim{align-items:center; justify-content:center; text-align:center; gap:14px; padding:24px;
       background:linear-gradient(160deg,#FFD86F,#FC9842)}
  #fim .trofeu{font-size:clamp(70px,22vw,130px); animation:tada 1s infinite}
  #fim h2{font-size:clamp(26px,8vw,44px); margin:0; color:#6b3d00; max-width:16ch}
  #fim p{font-size:clamp(16px,4.4vw,23px); margin:0; color:#7a4a00; font-weight:700; max-width:20ch; line-height:1.3}
  .linha-botoes{display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:10px}
  .btn2{background:#fff; color:var(--roxo); font-weight:800; font-size:clamp(16px,4.4vw,20px);
        padding:16px 24px; border-radius:999px; box-shadow:0 6px 0 rgba(0,0,0,.15)}
  .btn2:active{transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.15)}

  .confete{position:fixed; top:-20px; font-size:24px; z-index:15; pointer-events:none; animation:cair linear forwards}
  @keyframes cair{to{transform:translateY(110vh) rotate(720deg); opacity:.2}}

  .rodape{text-align:center; font-size:12px; opacity:.5; padding:8px}
  .sw{display:flex; align-items:center; gap:6px; font-size:14px; font-weight:700; color:var(--roxo);
      background:#EDE9FF; padding:9px 12px; border-radius:999px}
  .selvoz{
    font-family:inherit; font-size:12.5px; font-weight:700; color:var(--roxo); background:#EDE9FF;
    border:none; border-radius:999px; padding:10px 8px; max-width:32vw; appearance:none;
  }
  .sw{font-size:18px; padding:9px 13px}
</style>
</head>
<body>

<!-- ================= CAPA ================= -->
<section id="capa" class="tela ativa">
  <div class="emojizinhos">🎈 🧸 🚀 🦄 🐠</div>
  <h1>Mundo dos Jogos</h1>
  <p>Brincadeiras para aprender jogando</p>
  <button class="btn-grande" id="btnComecar">▶ Começar</button>
</section>

<!-- ================= IDADES ================= -->
<section id="idades" class="tela">
  <h2>Quantos anos você tem?</h2>
  <button class="idade ip" data-grupo="p">
    <span class="ico">🧸</span>
    <span class="txt">
      <span class="nome">5 a 7 anos</span>
      <span class="desc">Letras, contar, cores, formas, sequências e memória</span>
    </span>
  </button>
  <button class="idade ig" data-grupo="g">
    <span class="ico">🚀</span>
    <span class="txt">
      <span class="nome">8 a 11 anos</span>
      <span class="desc">Tabuada, contas, palavras, sequências, quiz e memória turbo</span>
    </span>
  </button>
  <div class="rodape">Dá para trocar de idade a qualquer momento</div>
</section>

<!-- ================= MENU ================= -->
<section id="menu" class="tela">
  <div class="topo">
    <button class="btn-icone" id="btnVoltarIdades" aria-label="Trocar idade">←</button>
    <h2 id="tituloMenu">Escolha uma brincadeira</h2>
    <span class="topo-dir">
      <select class="selvoz" id="selVoz" aria-label="Escolher voz" hidden></select>
      <button class="sw" id="btnVoz" aria-pressed="true">🔊</button>
    </span>
  </div>
  <div class="cartoes" id="cartoes"></div>
  <div class="rodape">Feito com carinho • funciona sem internet</div>
</section>

<!-- ================= JOGO ================= -->
<section id="jogo" class="tela">
  <div class="barra">
    <button class="btn-icone" id="btnVoltar" aria-label="Voltar">←</button>
    <div class="titulo-jogo" id="tituloJogo">Jogo</div>
    <button class="btn-icone" id="btnRepetir" aria-label="Repetir instrução">🔁</button>
    <div class="placar" id="placar">⭐ 0</div>
  </div>
  <div class="progresso"><i id="barraProg"></i></div>
  <div class="palco" id="palco"></div>
</section>

<!-- ================= FIM ================= -->
<section id="fim" class="tela">
  <div class="trofeu">🏆</div>
  <h2 id="fimTitulo">Muito bem!</h2>
  <p id="fimTexto"></p>
  <div class="linha-botoes">
    <button class="btn2" id="btnDeNovo">🔁 Jogar de novo</button>
    <button class="btn2" id="btnMenu">🏠 Outros jogos</button>
  </div>
</section>

<div class="aviso" id="aviso"></div>

<script>
(function(){
"use strict";

/* ============ utilidades ============ */
const $ = s => document.querySelector(s);
const rnd = n => Math.floor(Math.random()*n);
const escolha = a => a[rnd(a.length)];
const embaralhar = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=rnd(i+1);[b[i],b[j]]=[b[j],b[i]];} return b; };
const espera = ms => new Promise(r=>setTimeout(r,ms));
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// timers dos jogos com tempo (corrida / mira) — sempre limpos ao trocar de tela
let timers = [], intervalos = [];
function agendar(fn, ms){ const t=setTimeout(fn,ms); timers.push(t); return t; }
function repetir(fn, ms){ const t=setInterval(fn,ms); intervalos.push(t); return t; }
function limparTimers(){
  timers.forEach(clearTimeout); timers = [];
  intervalos.forEach(clearInterval); intervalos = [];
  corridaAtiva = false;
}

function mostrarTela(id){
  document.querySelectorAll('.tela').forEach(t=>t.classList.remove('ativa'));
  $('#'+id).classList.add('ativa');
  document.querySelectorAll('.confete').forEach(c=>c.remove());
  if(id !== 'jogo'){ limparTimers(); const p = $('#palco'); if(p) p.innerHTML = ''; }
  window.scrollTo(0,0);
}

/* ============ som ============ */
let ctx=null;
function audio(){
  if(!ctx){ try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(ctx.state==='suspended') ctx.resume();
  return ctx;
}
function tocar(freqs, dur=0.14, tipo='sine', vol=0.18){
  const c = audio(); if(!c) return;
  freqs.forEach((f,i)=>{
    const o=c.createOscillator(), g=c.createGain();
    o.type=tipo; o.frequency.value=f;
    const t0=c.currentTime + i*dur;
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(vol,t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0+dur+0.02);
  });
}

let vozLigada = true;
let vozEscolhida = null;
let vozesPt = [];

const NOMES_FEM = /luciana|francisca|maria|joana|in[eê]s|fernanda|camila|helena|leticia|let[ií]cia|thalita|catarina|raquel|brenda|giovanna|yara|female|mulher/i;
const NOMES_MASC = /daniel|ricardo|felipe|ant[oô]nio|j[uú]lio|heitor|donato|f[aá]bio|duarte|male|masculin|homem/i;
const MELHORES = /premium|enhanced|neural|natural|siri|wavenet|studio/i;

function pontuarVoz(v){
  const nome = (v.name||'');
  let p = 0;
  if(/pt[-_]BR/i.test(v.lang)) p += 100;
  else if(/^pt/i.test(v.lang)) p += 45;
  else return -1;
  if(MELHORES.test(nome)) p += 35;
  if(/google/i.test(nome)) p += 25;
  if(NOMES_FEM.test(nome)) p += 30;
  if(NOMES_MASC.test(nome)) p -= 60;
  if(v.localService === false) p += 5;
  return p;
}
function carregarVozes(){
  if(!('speechSynthesis' in window)) return;
  const todas = speechSynthesis.getVoices() || [];
  vozesPt = todas.filter(v=>/^pt/i.test(v.lang)).sort((a,b)=>pontuarVoz(b)-pontuarVoz(a));
  if(vozesPt.length && (!vozEscolhida || !vozesPt.some(v=>v.name===vozEscolhida.name))) vozEscolhida = vozesPt[0];
  montarSeletorVoz();
}
function montarSeletorVoz(){
  const sel = $('#selVoz'); if(!sel) return;
  if(vozesPt.length < 2){ sel.hidden = true; return; }
  const atual = vozEscolhida ? vozEscolhida.name : '';
  if(sel.dataset.qtd !== String(vozesPt.length)){
    sel.innerHTML = vozesPt.map(v=>`<option value="${esc(v.name)}">🎙️ ${esc(v.name.replace(/\(.*?\)/g,'').trim().slice(0,20))}</option>`).join('');
    sel.dataset.qtd = String(vozesPt.length);
  }
  sel.value = atual;
  sel.hidden = false;
}
if('speechSynthesis' in window){
  carregarVozes();
  speechSynthesis.onvoiceschanged = carregarVozes;
}

let ultimaFala = '';
// tom: 'normal' (instrução) | 'festa' (elogio) | 'calmo' (incentivo)
function falar(texto, guardar=true, tom='normal'){
  if(guardar) ultimaFala = texto;
  if(!vozLigada || !('speechSynthesis' in window) || !texto) return;
  try{
    speechSynthesis.cancel();
    const partes = (String(texto).match(/[^,.!?]+[,.!?]*/g) || [String(texto)])
                    .map(s=>s.trim()).filter(Boolean);
    partes.forEach((parte, i)=>{
      const u = new SpeechSynthesisUtterance(parte);
      u.lang = 'pt-BR';
      try{ if(vozEscolhida) u.voice = vozEscolhida; }catch(e){}
      if(tom === 'festa'){ u.rate = 1.05; u.pitch = 1.45; }
      else if(tom === 'calmo'){ u.rate = 0.9; u.pitch = 1.12; u.volume = .95; }
      else { u.rate = 0.97; u.pitch = 1.28; }
      u.pitch += (i % 2 ? -0.04 : 0.04);
      speechSynthesis.speak(u);
    });
  }catch(e){}
}
function destravarVoz(){
  if(!('speechSynthesis' in window)) return;
  try{ const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u); }catch(e){}
  carregarVozes();
  setTimeout(carregarVozes, 400);
  setTimeout(carregarVozes, 1500);
}

// gera distratores numéricos próximos do valor certo
function distratores(certo, qtd, min, max){
  const s = new Set([certo]);
  let tentativas = 0;
  while(s.size < qtd+1 && tentativas < 200){
    tentativas++;
    let d = certo + (rnd(2)?1:-1) * (1 + rnd(Math.max(3, Math.round(Math.abs(certo)*0.25))));
    if(d < min) d = min + rnd(3);
    if(d > max) d = max - rnd(3);
    if(Number.isFinite(d)) s.add(d);
  }
  let n = min;
  while(s.size < qtd+1){ if(!s.has(n)) s.add(n); n++; }
  const arr = [...s].filter(v=>v!==certo).slice(0,qtd);
  return embaralhar([certo, ...arr]);
}

  const a = 2 + rnd(9), b = 2 + rnd(9);
  const r = a*b;
  const ops = distratores(r, 3, 4, 110);
  $('#palco').innerHTML = `
    <div class="pergunta">Quanto é?</div>
    <div class="conta">${a} × ${b}</div>
    <div class="opcoes num">${ops.map(v=>`<button class="op" data-v="${v}">${v}</button>`).join('')}</div>`;
  falar(`Quanto é ${a} vezes ${b}?`);
  ligarOpcoes(r, `${a} vezes ${b} é igual a ${r}.`);
}

/* ============ 8-11: CONTAS RÁPIDAS ============ */
function jogoContas(){
  const op = escolha(['+','-','×','÷']);
  let a,b,r,fala;
  if(op==='+'){ a=10+rnd(90); b=10+rnd(90); r=a+b; fala=`${a} mais ${b}`; }
  else if(op==='-'){ a=20+rnd(80); b=1+rnd(a-1); r=a-b; fala=`${a} menos ${b}`; }
  else if(op==='×'){ a=2+rnd(11); b=2+rnd(11); r=a*b; fala=`${a} vezes ${b}`; }
  else { b=2+rnd(9); r=2+rnd(11); a=b*r; fala=`${a} dividido por ${b}`; }
  const ops = distratores(r, 3, 1, Math.max(20, r*2));
  $('#palco').innerHTML = `
    <div class="pergunta">Resolva:</div>
    <div class="conta">${a} ${op} ${b}</div>
    <div class="opcoes num">${ops.map(v=>`<button class="op" data-v="${v}">${v}</button>`).join('')}</div>`;
  falar(`Quanto é ${fala}?`);
  ligarOpcoes(r, `O resultado é ${r}.`);
}

/* ============ 8-11: SEQUÊNCIA NUMÉRICA ============ */
function jogoSequencia(){
  const tipo = escolha(['soma','subtrai','dobra','quadrados','fib']);
  let seq = [], dica = '';
  if(tipo==='soma'){
    const ini = 1+rnd(12), passo = 2+rnd(8);
    for(let i=0;i<6;i++) seq.push(ini + i*passo);
    dica = `A regra é somar ${passo} a cada passo.`;
  }else if(tipo==='subtrai'){
    const passo = 2+rnd(7), ini = 60+rnd(40);
    for(let i=0;i<6;i++) seq.push(ini - i*passo);
    dica = `A regra é tirar ${passo} a cada passo.`;
  }else if(tipo==='dobra'){
    const ini = 1+rnd(4);
    for(let i=0;i<6;i++) seq.push(ini * Math.pow(2,i));
    dica = 'A regra é dobrar o número anterior.';
  }else if(tipo==='quadrados'){
    const ini = 1+rnd(3);
    for(let i=0;i<6;i++){ const n = ini+i; seq.push(n*n); }
    dica = 'São os números multiplicados por eles mesmos.';
  }else{
    seq = [1,1,2,3,5,8,13];
    dica = 'Cada número é a soma dos dois anteriores.';
  }
  const resposta = seq[5] !== undefined ? seq[5] : seq[seq.length-1];
  const mostrados = seq.slice(0,5);
  const ops = distratores(resposta, 3, 1, Math.max(20, resposta*2));
  $('#palco').innerHTML = `
    <div class="pergunta">Qual é o próximo número?</div>
    <div class="sequencia">${mostrados.map(s=>`<span class="item num">${s}</span>`).join('')}<span class="item num vazio">?</span></div>
    <div class="opcoes num">${ops.map(v=>`<button class="op" data-v="${v}">${v}</button>`).join('')}</div>`;
  falar('Olhe a sequência. Qual é o próximo número?');
  ligarOpcoes(resposta, dica);
}

/* ============ 8-11: QUIZ ============ */
let quizUsadas = [];
function jogoQuiz(){
  let pool = QUIZ.filter(q=>!quizUsadas.includes(q.q));
  if(!pool.length){ quizUsadas = []; pool = QUIZ; }
  const q = escolha(pool);
  quizUsadas.push(q.q);
  const ops = embaralhar([q.c, ...q.e]);
  $('#palco').innerHTML = `
    <div class="pergunta">${esc(q.q)}</div>
    <div class="opcoes texto">${ops.map(o=>`<button class="op" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  falar(q.q);
  ligarOpcoes(q.c, `A resposta é ${q.c}.`);
}

/* ============ 8-11: PALAVRA EMBARALHADA ============ */
let anagramaAtual = null;
function jogoAnagrama(){
  const item = escolha(PALAVRAS_GRANDES);
  const letras = item.p.split('');
  let mistura = embaralhar(letras);
  if(mistura.join('') === item.p) mistura = embaralhar(mistura);
  anagramaAtual = { palavra:item.p, montado:[], usados:[] };
  $('#palco').innerHTML = `
    <div class="pergunta">Monte a palavra</div>
    <div class="destaque pequeno">${item.e}</div>
    <div class="montada" id="montada">${letras.map(()=>`<span class="slot"></span>`).join('')}</div>
    <div class="letras" id="letras">${mistura.map((l,i)=>`<button class="letra" data-i="${i}" data-l="${l}">${l}</button>`).join('')}</div>
    <button class="btn-apagar" id="btnApagar">⌫ Apagar</button>`;
  falar('Monte a palavra tocando nas letras.');
  $('#letras').querySelectorAll('.letra').forEach(b=>b.onclick=()=>porLetra(b));
  $('#btnApagar').onclick = tirarLetra;
}
function desenharAnagrama(){
  const slots = $('#montada').querySelectorAll('.slot');
  slots.forEach((s,i)=>{
    const l = anagramaAtual.montado[i] || '';
    s.textContent = l;
    s.classList.toggle('cheio', !!l);
  });
}
async function porLetra(botao){
  if(bloqueado || anagramaAtual.montado.length >= anagramaAtual.palavra.length) return;
  somToque();
  anagramaAtual.montado.push(botao.dataset.l);
  anagramaAtual.usados.push(botao);
  botao.classList.add('usada');
  desenharAnagrama();
  if(anagramaAtual.montado.length === anagramaAtual.palavra.length){
    if(anagramaAtual.montado.join('') === anagramaAtual.palavra){
      bloqueado = true;
      acertou(`A palavra é ${anagramaAtual.palavra}.`);
      confete(16);
      rodada++; atualizaPlacar();
      await espera(1400);
      bloqueado = false;
      proximaRodada();
    }else{
      errou();
      const m = $('#montada');
      m.style.animation='tremer .4s';
      await espera(700);
      m.style.animation='';
      limparAnagrama();
    }
  }
}
function tirarLetra(){
  if(bloqueado || !anagramaAtual || !anagramaAtual.montado.length) return;
  somToque();
  anagramaAtual.montado.pop();
  const b = anagramaAtual.usados.pop();
  if(b) b.classList.remove('usada');
  desenharAnagrama();
}
function limparAnagrama(){
  anagramaAtual.montado = [];
  anagramaAtual.usados.forEach(b=>b.classList.remove('usada'));
  anagramaAtual.usados = [];
  desenharAnagrama();
}

/* ============ MEMÓRIA (os dois grupos) ============ */
let memPrimeira=null, memPares=0, memTotal=0;
function jogoMemoria(pares){
  memPares = 0; memTotal = pares; memPrimeira = null; maxPontos = pares;
  const banco = ['🐶','🐱','🐼','🦊','🐸','🦁','🐵','🐷','🐰','🐨','🐮','🐔','🦄','🐢','🦋','🐳'];
  const bichos = embaralhar(banco).slice(0,pares);
  const cartas = embaralhar([...bichos,...bichos]);
  const cols = pares > 6 ? 4 : 4;
  $('#palco').innerHTML = `
    <div class="pergunta">Ache os pares iguais!</div>
    <div class="grade" style="grid-template-columns:repeat(${cols},1fr)">
      ${cartas.map((c,i)=>`
        <div class="carta" data-e="${c}" data-i="${i}">
          <div class="face costas">?</div>
          <div class="face frente">${c}</div>
        </div>`).join('')}
    </div>`;
  falar('Ache os pares iguais!');
  $('#palco').querySelectorAll('.carta').forEach(el=>el.onclick=()=>virarCarta(el));
  $('#barraProg').style.width='0%';
}
async function virarCarta(el){
  if(bloqueado || el.classList.contains('virada') || el.classList.contains('achada')) return;
  somToque();
  el.classList.add('virada');
  if(!memPrimeira){ memPrimeira = el; return; }
  if(memPrimeira === el) return;
  bloqueado = true;
  const a = memPrimeira, b = el;
  memPrimeira = null;
  if(a.dataset.e === b.dataset.e){
    await espera(320);
    a.classList.add('achada'); b.classList.add('achada');
    memPares++; estrelas++;
    $('#placar').textContent = '⭐ ' + estrelas;
    $('#barraProg').style.width = (memPares/memTotal*100) + '%';
    somAcerto(); aviso(escolha(ELOGIOS), true); falar('Achou um par! ' + escolha(ELOGIOS), false, 'festa'); confete(10);
    bloqueado=false;
    if(memPares === memTotal){ await espera(900); fimDeJogo(); }
  }else{
    errou();
    await espera(900);
    a.classList.remove('virada'); b.classList.remove('virada');
    bloqueado=false;
  }
}

/* ============ CORRIDA (toque rápido) ============ */
let corridaAtiva = false, corridaNum = 0, corridaTotal = 3;
function jogoCorrida(dificil){
  corridaTotal = 3; corridaNum = 0; maxPontos = corridaTotal;
  novaCorrida(dificil);
}
function novaCorrida(dificil){
  corridaNum++;
  const meuCarro = dificil ? '🏎️' : '🚗';
  const rival = dificil ? '🚙' : '🐢';
  let posEu = 0, posRival = 0;
  corridaAtiva = true;
  const passoEu = dificil ? 2.6 : 3.4;              // quanto anda por toque
  const velRival = dificil ? 1.25 : 0.85;           // quanto o rival anda a cada tique

  $('#palco').innerHTML = `
    <div class="pergunta">Corrida ${corridaNum} de ${corridaTotal}</div>
    <div class="subtexto">Toque bem rápido no botão para acelerar!</div>
    <div class="pista">
      <div class="faixa eu"><span class="quem">VOCÊ</span><span class="chegada"></span>
        <span class="veiculo" id="vEu" style="left:8%">${meuCarro}</span></div>
      <div class="faixa"><span class="quem">RIVAL</span><span class="chegada"></span>
        <span class="veiculo" id="vRival" style="left:8%">${rival}</span></div>
    </div>
    <button class="btn-turbo" id="btnTurbo">🏁 ACELERAR!</button>`;

  const elEu = $('#vEu'), elRival = $('#vRival');
  const desenhar = ()=>{
    elEu.style.left = (8 + posEu*0.82) + '%';
    elRival.style.left = (8 + posRival*0.82) + '%';
    $('#barraProg').style.width = Math.max(posEu, posRival) + '%';
  };
  falar(dificil ? 'Prepara... vai! Toque rápido para acelerar.' : 'Prepara... vai! Toque bem rápido!');

  const acelerar = ()=>{
    if(!corridaAtiva) return;
    posEu = Math.min(100, posEu + passoEu);
    tocar([420 + rnd(160)], 0.05, 'square', 0.06);
    desenhar();
    if(posEu >= 100) terminarCorrida(true, dificil);
  };
  const btn = $('#btnTurbo');
  btn.onclick = acelerar;

  repetir(()=>{
    if(!corridaAtiva) return;
    posRival = Math.min(100, posRival + velRival*(0.7 + Math.random()*0.7));
    desenhar();
    if(posRival >= 100) terminarCorrida(false, dificil);
  }, 90);
}
async function terminarCorrida(ganhou, dificil){
  if(!corridaAtiva) return;
  corridaAtiva = false;
  limparTimers();
  if(ganhou){
    estrelas++; $('#placar').textContent = '⭐ ' + estrelas;
    somAcerto(); aviso('Você ganhou! 🏆', true); falar('Uhul! Você ganhou a corrida!', false, 'festa'); confete(24);
  }else{
    somErro(); aviso('O rival chegou primeiro!', false); falar('Quase! Na próxima você ganha.', false, 'calmo');
  }
  await espera(1600);
  if(corridaNum >= corridaTotal) fimDeJogo();
  else novaCorrida(dificil);
}

let puzN = 3, puzOrdem = [], puzSel = -1, puzImg = '';
function jogoPuzzle(n){
  puzN = n;
  const svg = escolha(CENAS);
  puzImg = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  const total = n*n;
  do { puzOrdem = embaralhar([...Array(total).keys()]); } while (puzOrdem.every((v,i)=>v===i));
  puzSel = -1;
  $('#palco').innerHTML = `
    <div class="pergunta">Monte a figura</div>
    <div class="subtexto">Toque em duas peças para trocar de lugar</div>
    <img class="miniatura" src="${puzImg}" alt="figura completa">
    <div class="puzzle" id="puzzle" style="grid-template-columns:repeat(${n},1fr)"></div>`;
  desenharPuzzle();
  falar('Monte a figura! Toque em duas peças para trocar de lugar.');
}
function desenharPuzzle(){
  const n = puzN, cont = $('#puzzle');
  cont.innerHTML = puzOrdem.map((peca,pos)=>{
    const c = peca % n, r = Math.floor(peca / n);
    const px = n>1 ? (c/(n-1))*100 : 0, py = n>1 ? (r/(n-1))*100 : 0;
    return `<div class="peca${pos===puzSel?' sel':''}" data-pos="${pos}"
      style="background-image:url('${puzImg}');background-size:${n*100}% ${n*100}%;background-position:${px}% ${py}%"></div>`;
  }).join('');
  cont.querySelectorAll('.peca').forEach(p=>p.onclick=()=>tocarPeca(+p.dataset.pos));
}
async function tocarPeca(pos){
  if(bloqueado) return;
  somToque();
  if(puzSel < 0){ puzSel = pos; desenharPuzzle(); return; }
  if(puzSel === pos){ puzSel = -1; desenharPuzzle(); return; }
  const a = puzSel, b = pos;
  [puzOrdem[a], puzOrdem[b]] = [puzOrdem[b], puzOrdem[a]];
  puzSel = -1;
  desenharPuzzle();
  if(puzOrdem.every((v,i)=>v===i)){
    bloqueado = true;
    acertou('Você montou a figura!');
    confete(22);
    rodada++; atualizaPlacar();
    await espera(1600);
    bloqueado = false;
    proximaRodada();
  }
}

/* ============ MIRA ============ */
let miraRestantes = 0, miraTotal = 12;
function jogoMira(dificil){
  miraTotal = 12; miraRestantes = miraTotal; maxPontos = miraTotal;
  $('#palco').innerHTML = `
    <div class="pergunta">Toque nos alvos!</div>
    <div class="subtexto">${dificil ? 'Cuidado: não toque nas bombas 💣' : 'Seja rápido!'}</div>
    <div class="arena" id="arena"></div>`;
  falar(dificil ? 'Toque nos alvos! Mas não toque nas bombas.' : 'Toque nos alvos bem rápido!');
  agendar(()=>soltarAlvo(dificil), 500);
}
function soltarAlvo(dificil){
  const arena = $('#arena');
  if(!arena || miraRestantes <= 0) return;
  const bomba = dificil && Math.random() < 0.28;
  const vida = dificil ? 1150 : 1700;
  const el = document.createElement('button');
  el.className = 'alvo' + (dificil ? ' pequeno' : '');
  el.textContent = bomba ? '💣' : escolha(['🎯','🐤','🎈','🍎','⭐','🐸','🍓','🦋']);
  el.style.left = (14 + Math.random()*72) + '%';
  el.style.top  = (16 + Math.random()*68) + '%';
  arena.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('entrou'));

  let tratado = false;
  const sumir = ()=>{
    if(tratado) return; tratado = true;
    el.classList.remove('entrou');
    agendar(()=>el.remove(), 200);
    if(!bomba){ miraRestantes--; $('#barraProg').style.width = ((miraTotal-miraRestantes)/miraTotal*100)+'%'; }
    if(miraRestantes <= 0) agendar(fimDeJogo, 500);
    else agendar(()=>soltarAlvo(dificil), 260 + rnd(320));
  };
  el.onclick = ()=>{
    if(tratado) return;
    if(bomba){
      tratado = true;
      somErro(); aviso('Bomba! 💣', false); falar('Essa era uma bomba! Cuidado.', false, 'calmo');
      if(estrelas > 0){ estrelas--; $('#placar').textContent = '⭐ ' + estrelas; }
      el.remove();
      agendar(()=>soltarAlvo(dificil), 400);
      return;
    }
    tratado = true;
    estrelas++; $('#placar').textContent = '⭐ ' + estrelas;
    miraRestantes--; $('#barraProg').style.width = ((miraTotal-miraRestantes)/miraTotal*100)+'%';
    somAcerto(); aviso(escolha(ELOGIOS), true); confete(8);
    el.style.transform = 'translate(-50%,-50%) scale(1.6)';
    el.style.opacity = '0';
    agendar(()=>el.remove(), 200);
    if(miraRestantes <= 0) agendar(fimDeJogo, 700);
    else agendar(()=>soltarAlvo(dificil), 240 + rnd(280));
  };
  agendar(sumir, vida);
}

  {id:'contas',   g:'g', ico:'🧮', nome:'Contas Rápidas',   desc:'+  −  ×  ÷',              cor:'c3', fn:jogoContas},
  {id:'anagrama', g:'g', ico:'🔡', nome:'Palavra Embaralhada', desc:'Monte a palavra',      cor:'c1', fn:jogoAnagrama},
  {id:'sequencia',g:'g', ico:'📈', nome:'Sequência Numérica', desc:'Qual é o próximo?',     cor:'c5', fn:jogoSequencia},
  {id:'quiz',     g:'g', ico:'🌎', nome:'Quiz Rápido',      desc:'Conhecimentos gerais',    cor:'c6', fn:jogoQuiz},
  {id:'memoria2', g:'g', ico:'🧠', nome:'Memória Turbo',    desc:'8 pares',                 cor:'c4', fn:()=>jogoMemoria(8)},
  {id:'corrida2', g:'g', ico:'🏎️', nome:'Corrida Turbo',    desc:'Rival mais rápido',       cor:'c2', fn:()=>jogoCorrida(true), rodadas:3},
  {id:'puzzle2',  g:'g', ico:'🧩', nome:'Quebra-cabeça',    desc:'Monte a figura (4×4)',    cor:'c3', fn:()=>jogoPuzzle(4), rodadas:3},
  {id:'mira2',    g:'g', ico:'🎯', nome:'Mira Turbo',       desc:'Alvos rápidos e bombas',  cor:'c1', fn:()=>jogoMira(true), rodadas:12}
];
const porId = id => CATALOGO.find(j=>j.id===id);

/* ============ fluxo ============ */
function abrirMenu(grupo){
  grupoAtual = grupo;
  $('#tituloMenu').textContent = grupo==='p' ? '🧸 5 a 7 anos' : '🚀 8 a 11 anos';
  $('#cartoes').innerHTML = CATALOGO.filter(j=>j.g===grupo).map(j=>`
    <button class="cartao ${j.cor}" data-jogo="${j.id}">
      <span class="ico">${j.ico}</span>
      <span class="nome">${j.nome}</span>
      <span class="desc">${j.desc}</span>
    </button>`).join('');
  $('#cartoes').querySelectorAll('.cartao').forEach(c=>{
    c.onclick = ()=>{ audio(); somToque(); iniciarJogo(c.dataset.jogo); };
  });
  mostrarTela('menu');
}
function iniciarJogo(id){
  const j = porId(id); if(!j) return;
  limparTimers();
  jogoAtual = id; rodada = 0; estrelas = 0; bloqueado = false;
  totalRodadas = j.rodadas || (j.g === 'g' ? 10 : 8);
  maxPontos = totalRodadas;
  $('#tituloJogo').textContent = j.ico + ' ' + j.nome;
  atualizaPlacar();
  mostrarTela('jogo');
  j.fn();
}
function proximaRodada(){
  if(rodada >= totalRodadas){ fimDeJogo(); return; }
  porId(jogoAtual).fn();
}
function fimDeJogo(){
  limparTimers();
  const max = maxPontos;
  $('#fimTexto').textContent = `Você ganhou ${estrelas} ${estrelas===1?'estrela':'estrelas'} de ${max}! ⭐`;
  $('#fimTitulo').textContent = estrelas>=max ? 'Perfeito!' : 'Muito bem!';
  mostrarTela('fim');
  somFesta(); confete(50);
  falar(estrelas>=max ? 'Perfeito! Você acertou tudo! Parabéns!' : 'Muito bem! Você conseguiu!', false, 'festa');
}

/* ============ eventos ============ */
$('#btnComecar').onclick = ()=>{
  audio(); destravarVoz(); somToque();
  mostrarTela('idades');
  setTimeout(()=>falar('Oi! Quantos anos você tem?', false, 'festa'), 250);
};
document.querySelectorAll('.idade').forEach(b=>{
  b.onclick = ()=>{ audio(); somToque(); abrirMenu(b.dataset.grupo); falar('Escolha uma brincadeira.', false); };
});
$('#btnVoltarIdades').onclick = ()=>{ somToque(); if('speechSynthesis' in window) speechSynthesis.cancel(); mostrarTela('idades'); };
$('#btnVoltar').onclick = ()=>{ if('speechSynthesis' in window) speechSynthesis.cancel(); somToque(); abrirMenu(grupoAtual); };
$('#btnMenu').onclick   = ()=>{ somToque(); abrirMenu(grupoAtual); };
$('#btnDeNovo').onclick = ()=>{ somToque(); iniciarJogo(jogoAtual); };
$('#btnRepetir').onclick= ()=>{ somToque(); falar(ultimaFala, false); };
$('#btnVoz').onclick = ()=>{
  vozLigada = !vozLigada;
  $('#btnVoz').textContent = vozLigada ? '🔊' : '🔇';
  $('#btnVoz').setAttribute('aria-pressed', String(vozLigada));
  if(!vozLigada && 'speechSynthesis' in window) speechSynthesis.cancel();
  else falar('Oi! Vamos brincar?', false, 'festa');
  somToque();
};
$('#selVoz').onchange = (e)=>{
  vozEscolhida = vozesPt.find(v=>v.name===e.target.value) || vozEscolhida;
  vozLigada = true;
  $('#btnVoz').textContent = '🔊';
  falar('Oi! Eu sou a sua amiga dos jogos. Vamos brincar?', false, 'festa');
};

// evita zoom por duplo toque no iOS
let ultimoToque = 0;
document.addEventListener('touchend', e=>{
  const agora = Date.now();
  if(agora - ultimoToque < 320) e.preventDefault();
  ultimoToque = agora;
}, {passive:false});

// para testes automatizados
window.__jogo = {
  abrirMenu, iniciarJogo,
  ids: CATALOGO.map(j=>j.id),
  get estado(){ return {jogoAtual, rodada, estrelas, totalRodadas, grupoAtual}; },
  get anagrama(){ return anagramaAtual ? {palavra:anagramaAtual.palavra, montado:anagramaAtual.montado.slice()} : null; },
  get puzzle(){ return {n:puzN, ordem:puzOrdem.slice(), sel:puzSel}; },
  get maxPontos(){ return maxPontos; }
};
})();
</script>
</body>
</html>
