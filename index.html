<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5B4BE0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Mundo dos Jogos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎈</text></svg>">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --roxo:#5B4BE0; --roxo2:#8B7CF6;
    --amarelo:#FFC93C; --verde:#2FBF71; --vermelho:#FF5D5D;
    --azul:#3AA3F5; --rosa:#FF7BC1; --laranja:#FF9448;
    --fundo:#F4F1FF; --escuro:#2C2350;
    --raio:26px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; font-family:"Baloo 2",'Comic Sans MS','Trebuchet MS',system-ui,-apple-system,sans-serif;
    background:var(--fundo); color:var(--escuro);
    overscroll-behavior:none; touch-action:manipulation;
    user-select:none;-webkit-user-select:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    display:flex; flex-direction:column; min-height:100dvh; overflow-x:hidden;
  }
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}

  .tela{display:none; flex:1; flex-direction:column; min-height:0}
  .tela.ativa{display:flex}

  /* ---------- capa ---------- */
  #capa{
    align-items:center; justify-content:center; text-align:center; gap:6px; padding:20px;
    background:linear-gradient(160deg,#6C5CE7,#8B7CF6 45%,#3AA3F5); color:#fff;
  }
  #capa h1{font-size:clamp(34px,10vw,64px); margin:0; line-height:1.05; text-shadow:0 6px 0 rgba(0,0,0,.15)}
  #capa p{font-size:clamp(15px,4.2vw,20px); opacity:.92; margin:4px 0 22px; max-width:22ch}
  .btn-grande{
    background:var(--amarelo); color:#5a3d00; font-size:clamp(22px,6.5vw,30px); font-weight:800;
    padding:20px 42px; border-radius:999px; box-shadow:0 8px 0 #d99f00, 0 14px 26px rgba(0,0,0,.25);
    transition:transform .08s, box-shadow .08s;
  }
  .btn-grande:active{transform:translateY(6px); box-shadow:0 2px 0 #d99f00}
  .emojizinhos{font-size:clamp(30px,9vw,46px); letter-spacing:6px; margin-bottom:6px}

  /* ---------- idades ---------- */
  #idades{padding:18px 14px 24px; align-items:center; justify-content:center; gap:16px}
  #idades h2{margin:0 0 4px; font-size:clamp(22px,6vw,32px); text-align:center}
  .idade{
    width:100%; max-width:520px; border-radius:var(--raio); padding:22px 18px; color:#fff; text-align:left;
    display:flex; align-items:center; gap:16px;
    box-shadow:0 8px 0 rgba(0,0,0,.18), 0 12px 24px rgba(0,0,0,.12);
    transition:transform .1s, box-shadow .1s;
  }
  .idade:active{transform:translateY(5px); box-shadow:0 3px 0 rgba(0,0,0,.18)}
  .idade .ico{font-size:clamp(42px,13vw,60px); line-height:1; flex:0 0 auto}
  .idade .txt{flex:1}
  .idade .nome{font-size:clamp(20px,5.6vw,26px); font-weight:800; display:block}
  .idade .desc{font-size:clamp(13px,3.6vw,15px); opacity:.92; line-height:1.3}
  .ip{background:linear-gradient(150deg,#FF7BC1,#E5468F)}
  .ig{background:linear-gradient(150deg,#3AA3F5,#1E6FD9)}

  /* ---------- menu ---------- */
  #menu{padding:14px 14px 22px}
  .topo{display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:8px; margin-bottom:12px}
  .topo h2{margin:0; font-size:clamp(16px,4.4vw,24px); min-width:0; white-space:nowrap;
           overflow:hidden; text-overflow:ellipsis}
  .topo-dir{display:flex; align-items:center; gap:6px; justify-self:end}
  .cartoes{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr)); gap:12px;
    flex:1; align-content:center; width:100%; max-width:820px; margin:0 auto;
  }
  .cartao{
    border-radius:var(--raio); padding:16px 12px; color:#fff; text-align:center;
    box-shadow:0 8px 0 rgba(0,0,0,.18), 0 12px 24px rgba(0,0,0,.12);
    display:flex; flex-direction:column; align-items:center; gap:6px; min-height:142px; justify-content:center;
    transition:transform .1s, box-shadow .1s;
  }
  .cartao:active{transform:translateY(5px); box-shadow:0 3px 0 rgba(0,0,0,.18)}
  .cartao .ico{font-size:clamp(34px,10vw,50px); line-height:1}
  .cartao .nome{font-size:clamp(15px,4.2vw,19px); font-weight:800; line-height:1.15}
  .cartao .desc{font-size:12.5px; opacity:.92; line-height:1.25}
  .c1{background:linear-gradient(150deg,#FF7BC1,#E5468F)}
  .c2{background:linear-gradient(150deg,#3AA3F5,#1E6FD9)}
  .c3{background:linear-gradient(150deg,#2FBF71,#159B58)}
  .c4{background:linear-gradient(150deg,#FF9448,#EA6A1B)}
  .c5{background:linear-gradient(150deg,#8B7CF6,#5B4BE0)}
  .c6{background:linear-gradient(150deg,#FFC93C,#E09A00)}

  /* ---------- barra ---------- */
  .barra{
    display:flex; align-items:center; gap:6px; padding:10px 8px;
    background:#fff; border-bottom:3px solid rgba(0,0,0,.06); position:sticky; top:0; z-index:5;
  }
  .btn-icone{
    width:clamp(42px,12vw,50px); height:clamp(42px,12vw,50px); border-radius:16px; background:#EDE9FF; color:var(--roxo);
    font-size:clamp(19px,5.4vw,24px); display:flex; align-items:center; justify-content:center; font-weight:800; flex:0 0 auto;
  }
  .btn-icone:active{background:#ddd6ff}
  .titulo-jogo{flex:1; font-size:clamp(15px,4.2vw,20px); font-weight:800; text-align:center; line-height:1.15}
  .placar{
    background:#FFF4D1; color:#8a6100; font-weight:800; border-radius:16px; padding:8px 10px;
    font-size:clamp(13px,3.6vw,18px); white-space:nowrap;
  }
  .btn-icone.mudo{background:#FFE0E0; color:#c33}
  .progresso{height:10px; background:#E6E1FA}
  .progresso i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--verde),#7BE3AE); transition:width .3s}

  /* ---------- palco ---------- */
  .palco.compacto{justify-content:flex-start; gap:8px; padding-top:10px}
  .palco.compacto .pergunta{font-size:clamp(17px,4.4vw,24px)}
  .palco{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:space-evenly;
    gap:10px; padding:16px 14px 26px; min-height:0; text-align:center;
  }
  .pergunta{font-size:clamp(19px,5vw,30px); font-weight:800; line-height:1.25; max-width:26ch}
  .subtexto{font-size:clamp(13px,3.6vw,17px); opacity:.65; margin-top:-4px}
  .destaque{
    font-size:min(26vw,22vh,170px); font-weight:900; line-height:1;
    color:var(--roxo); text-shadow:0 6px 0 rgba(91,75,224,.18);
  }
  .destaque.pequeno{font-size:min(20vw,18vh,130px)}
  .conta{
    font-size:min(15vw,11vh,86px); font-weight:900; color:var(--roxo); line-height:1.1;
    text-shadow:0 5px 0 rgba(91,75,224,.16); letter-spacing:2px;
  }
  .contagem{
    display:grid; gap:6px 10px; justify-items:center; align-items:center;
    max-width:min(92vw,560px); font-size:min(13vw,8vh,68px); line-height:1;
  }
  .contagem span{animation:pop .3s backwards}
  @keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
  .grupos{display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center;
          font-size:min(11vw,7vh,54px); line-height:1.1}
  .grupos .mais{font-size:min(9vw,6vh,44px); font-weight:900; color:var(--roxo)}
  .grupos .caixa{background:#fff; border-radius:20px; padding:10px 12px; box-shadow:0 5px 0 rgba(0,0,0,.1);
                 max-width:min(40vw,220px); line-height:1.15}

  .sequencia{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; align-items:center;
             font-size:min(11vw,7vh,56px)}
  .sequencia .item{background:#fff; border-radius:18px; padding:6px 10px; box-shadow:0 4px 0 rgba(0,0,0,.1); min-width:1.4em}
  .sequencia .item.num{font-size:min(8vw,5vh,40px); font-weight:900; color:var(--escuro)}
  .sequencia .vazio{background:#EDE9FF; color:var(--roxo); font-weight:900}

  .opcoes{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; width:100%; max-width:620px}
  .op{
    background:#fff; border-radius:var(--raio); box-shadow:0 6px 0 rgba(0,0,0,.12), 0 10px 20px rgba(0,0,0,.08);
    min-width:104px; min-height:min(28vw,110px); flex:1 1 104px; max-width:190px;
    display:flex; align-items:center; justify-content:center; padding:12px;
    font-size:min(13vw,8vh,70px); font-weight:900; color:var(--escuro);
    transition:transform .1s, box-shadow .1s;
  }
  .op:active{transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.12)}
  .op.certo{background:#D6F7E6; box-shadow:0 6px 0 #2FBF71; animation:tada .5s}
  .op.errado{background:#FFE0E0; box-shadow:0 6px 0 #FF5D5D; animation:tremer .4s}
  .op.apagado{opacity:.35}
  .op svg{width:min(18vw,10vh,100px); height:min(18vw,10vh,100px)}
  .opcoes.num .op{font-size:min(11vw,7vh,54px); min-height:min(22vw,92px)}
  .opcoes.texto{max-width:640px}
  .opcoes.texto .op{
    flex:1 1 44%; max-width:none; min-height:68px; padding:14px 12px;
    font-size:clamp(15px,4.2vw,21px); font-weight:800; line-height:1.25; text-align:center; word-break:break-word;
  }
  @keyframes tada{0%{transform:scale(1)}30%{transform:scale(1.16) rotate(-4deg)}60%{transform:scale(1.16) rotate(4deg)}100%{transform:scale(1)}}
  @keyframes tremer{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}

  /* ---------- anagrama ---------- */
  .montada{
    display:flex; gap:6px; flex-wrap:wrap; justify-content:center; min-height:64px; align-items:center;
  }
  .montada .slot{
    width:clamp(34px,9vw,52px); height:clamp(46px,12vw,66px); border-radius:14px; background:#EDE9FF;
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(20px,5.5vw,32px); font-weight:900; color:var(--roxo);
  }
  .montada .slot.cheio{background:#fff; box-shadow:0 4px 0 rgba(0,0,0,.12); color:var(--escuro)}
  .letras{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; max-width:600px}
  .letra{
    width:clamp(44px,12vw,66px); height:clamp(52px,14vw,74px); border-radius:16px; background:#fff;
    box-shadow:0 5px 0 rgba(0,0,0,.14); font-size:clamp(22px,6vw,34px); font-weight:900;
    display:flex; align-items:center; justify-content:center; transition:transform .1s, opacity .15s;
  }
  .letra:active{transform:translateY(4px)}
  .letra.usada{opacity:.25; pointer-events:none}
  .btn-apagar{background:#EDE9FF; color:var(--roxo); font-weight:800; border-radius:999px;
              padding:12px 22px; font-size:clamp(15px,4vw,18px); box-shadow:0 5px 0 rgba(0,0,0,.1)}

  /* ---------- corrida ---------- */
  .pista{width:100%; max-width:600px; display:flex; flex-direction:column; gap:10px}
  .faixa{
    position:relative; height:clamp(58px,15vw,84px); border-radius:22px; overflow:hidden;
    background:#fff; box-shadow:0 5px 0 rgba(0,0,0,.1);
  }
  .faixa.eu{background:linear-gradient(90deg,#EDE9FF,#fff)}
  .faixa .chegada{position:absolute; right:8px; top:6px; bottom:6px; width:12px; border-radius:4px;
    background:repeating-linear-gradient(45deg,#2C2350 0 6px,#fff 6px 12px)}
  .faixa .veiculo{position:absolute; top:50%; transform:translate(-50%,-50%);
    font-size:clamp(28px,8vw,44px); transition:left .12s linear}
  .faixa .quem{position:absolute; left:10px; top:6px; font-size:12px; font-weight:800; opacity:.5}
  .btn-turbo{
    background:var(--amarelo); color:#5a3d00; font-size:clamp(20px,6vw,28px); font-weight:900;
    padding:22px 44px; border-radius:999px; box-shadow:0 8px 0 #d99f00; width:min(90%,420px);
  }
  .btn-turbo:active{transform:translateY(6px); box-shadow:0 2px 0 #d99f00}

  /* ---------- quebra-cabeça ---------- */
  .puzzle{
    display:grid; gap:4px; width:min(88vw,52vh,420px); aspect-ratio:1/1;
    background:#fff; padding:6px; border-radius:22px; box-shadow:0 6px 0 rgba(0,0,0,.12);
  }
  .peca{background-repeat:no-repeat; border-radius:8px; transition:transform .12s, outline-color .12s;
        outline:4px solid transparent; outline-offset:-4px}
  .peca.sel{outline-color:var(--roxo); transform:scale(.9)}
  .miniatura{width:clamp(56px,16vw,88px); border-radius:12px; box-shadow:0 4px 0 rgba(0,0,0,.12)}

  /* ---------- cena com física (estilingue / duelo) ---------- */
  .cena{
    width:100%; max-width:860px; aspect-ratio:16/9; border-radius:22px; display:block;
    background:#BDE3FF; box-shadow:0 6px 0 rgba(0,0,0,.12); touch-action:none; cursor:grab;
  }
  .cena:active{cursor:grabbing}
  .hud{display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap;
       font-size:clamp(14px,4vw,18px); font-weight:800}
  .hud .chip{background:#fff; border-radius:999px; padding:7px 12px; box-shadow:0 4px 0 rgba(0,0,0,.1);
             font-size:clamp(12px,3.4vw,16px)}
  .hud .alvo-eu{background:#DCEBFF; color:#1E4FA3}
  .hud .alvo-pc{background:#FFE2E2; color:#A32020}
  .hud .vez{background:#FFF4D1; color:#8a6100}
  .niveis{display:flex; flex-direction:column; gap:12px; width:100%; max-width:460px; margin:auto}
  .nivel{
    display:grid; grid-template-columns:auto 1fr; gap:4px 14px; align-items:center; text-align:left;
    background:#fff; border-radius:22px; padding:16px 18px; box-shadow:0 6px 0 rgba(0,0,0,.12);
  }
  .nivel:active{transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.12)}
  .nivel .ni{grid-row:1/4; font-size:clamp(34px,10vw,46px)}
  .nivel .nn{font-size:clamp(18px,5vw,23px); font-weight:900; color:var(--roxo)}
  .nivel .nd{font-size:clamp(13px,3.6vw,16px); opacity:.7}
  .nivel .nv{font-size:12px; opacity:.85}

  /* ---------- forca ---------- */
  .forca-area{display:flex; gap:14px; align-items:center; justify-content:center; flex-wrap:wrap}
  .forca-desenho svg{width:min(38vw,22vh,180px); height:auto; display:block}
  .forca-lado{display:flex; flex-direction:column; gap:8px; align-items:center}
  .palavraForca{display:flex; gap:5px; flex-wrap:wrap; justify-content:center; max-width:min(56vw,330px)}
  .slotForca{
    width:clamp(24px,6.4vw,34px); height:clamp(34px,9vw,46px); border-radius:10px; background:#EDE9FF;
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(16px,4.4vw,24px); font-weight:900; color:var(--roxo);
  }
  .slotForca.cheio{background:#fff; box-shadow:0 3px 0 rgba(0,0,0,.12); color:var(--escuro)}
  .vidasForca{font-size:clamp(13px,3.6vw,17px); letter-spacing:2px}
  .teclado{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; width:100%; max-width:420px}
  .tecla{
    height:clamp(38px,10vw,46px); border-radius:12px; background:#fff; font-weight:900;
    font-size:clamp(15px,4vw,19px); color:var(--escuro); box-shadow:0 4px 0 rgba(0,0,0,.12);
  }
  .tecla:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.12)}
  .tecla.ok{background:#D6F7E6; box-shadow:0 4px 0 #2FBF71; color:#12794a}
  .tecla.nao{background:#EFEFEF; color:#aaa; box-shadow:none; opacity:.6}

  /* ---------- salão de beleza ---------- */
  .salao{display:flex; flex-direction:column; align-items:center; gap:10px; width:100%}
  .rosto svg{width:min(56vw,30vh,260px); height:auto; display:block;
             filter:drop-shadow(0 6px 0 rgba(0,0,0,.10))}
  .abas{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; max-width:620px}
  .aba{background:#EDE9FF; color:var(--roxo); border-radius:999px; padding:7px 11px;
       font-size:12.5px; font-weight:800; white-space:nowrap}
  .aba.on{background:var(--roxo); color:#fff}
  .opcoesSalao{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; max-width:600px; min-height:52px}
  .chip-cor{width:44px; height:44px; border-radius:14px; box-shadow:0 4px 0 rgba(0,0,0,.15);
            outline:4px solid transparent; outline-offset:2px}
  .chip-cor.on{outline-color:var(--roxo)}
  .chip-est.corte{min-width:56px; height:auto; padding:4px; overflow:hidden}
  .chip-est.corte svg{width:clamp(42px,12vw,54px); height:auto; display:block}
  .chip-est{min-width:54px; height:44px; border-radius:14px; background:#fff; font-size:22px;
            display:flex; align-items:center; justify-content:center; box-shadow:0 4px 0 rgba(0,0,0,.12);
            outline:4px solid transparent; outline-offset:2px}
  .chip-est.on{outline-color:var(--roxo)}
  .btn-banho{
    background:#6EC6FF; color:#083b5c; font-size:clamp(17px,4.8vw,23px); font-weight:900;
    padding:18px 28px; border-radius:999px; box-shadow:0 7px 0 #2E9BD6; width:min(90%,380px);
  }
  .btn-banho:active{transform:translateY(5px); box-shadow:0 2px 0 #2E9BD6}
  .passos-banho{display:flex; gap:10px; justify-content:center; font-size:clamp(20px,5.6vw,26px)}
  .bolinha{opacity:.3; transition:opacity .2s, transform .2s}
  .bolinha.feito{opacity:1}
  .bolinha.agora{opacity:1; transform:scale(1.25); animation:pulsa 1s infinite}
  @keyframes pulsa{0%,100%{transform:scale(1.2)}50%{transform:scale(1.38)}}
  .area-banho{position:relative; touch-action:none; cursor:grab; user-select:none}
  .area-banho:active{cursor:grabbing}
  .ferramenta{
    position:absolute; transform:translate(-50%,-60%) scale(.9); font-size:clamp(30px,8vw,44px);
    pointer-events:none; opacity:0; transition:opacity .15s, transform .15s; left:50%; top:50%;
  }
  .ferramenta.ativa{opacity:1; transform:translate(-50%,-60%) scale(1.1) rotate(-12deg)}
  .instrucao-banho{font-size:clamp(13px,3.8vw,17px); font-weight:700; opacity:.8; text-align:center}
  .barra-banho{width:min(80%,340px); height:16px; border-radius:999px; background:#E6E1FA; overflow:hidden}
  .barra-banho i{display:block; height:100%; width:0; border-radius:999px;
                 background:linear-gradient(90deg,#4FC3F7,#7BE3AE); transition:width .12s}
  .aba.pedida{box-shadow:0 0 0 3px #FFC93C}
  .cliente-tag{font-weight:900; margin-right:4px}
  .cp-texto{margin-right:6px}
  .pedido-chips{display:inline-flex; gap:8px; flex-wrap:wrap; justify-content:center; vertical-align:middle}
  .chip-pedido{
    display:inline-flex; align-items:center; gap:6px; background:#fff; border-radius:999px;
    padding:6px 12px 6px 8px; box-shadow:0 3px 0 rgba(0,0,0,.14); font-weight:800;
    font-size:clamp(12px,3.4vw,15px); color:var(--escuro);
  }
  .chip-pedido.ok{background:#D6F7E6; box-shadow:0 3px 0 #2FBF71}
  .cp-ico{font-size:clamp(15px,4.2vw,19px)}
  .cp-amostra{
    width:clamp(22px,6vw,28px); height:clamp(22px,6vw,28px); border-radius:50%;
    display:inline-block; box-shadow:inset 0 0 0 2px rgba(0,0,0,.12);
  }
  .cp-amostra.emoji{background:#F3F0FF; display:inline-flex; align-items:center;
                    justify-content:center; font-size:clamp(14px,4vw,18px); border-radius:9px}
  .cp-amostra.corte{background:none; box-shadow:none; border-radius:9px; overflow:hidden;
                    width:auto; height:clamp(28px,7.5vw,34px); display:inline-flex; align-items:center}
  .cp-amostra.corte svg{height:100%; width:auto}
  .cp-nome{opacity:.75; font-weight:700}
  .cp-check{font-size:13px}
  @media (max-width:430px){ .cp-nome{display:none} }
  .rosto.penteavel{cursor:pointer; position:relative}
  .rosto.penteavel svg{animation:brilha 1.3s infinite}
  @keyframes brilha{
    0%,100%{filter:drop-shadow(0 6px 0 rgba(0,0,0,.10))}

  }
  .pedido{background:#FFF4D1; color:#8a6100; border-radius:16px; padding:9px 14px; font-weight:700;
          font-size:clamp(13px,3.8vw,17px); text-align:center; max-width:600px; line-height:1.3}

  /* ---------- memoria ---------- */
  .grade{display:grid; gap:10px; width:100%; max-width:min(460px,58vh); margin:auto}
  .carta{position:relative; aspect-ratio:1/1; perspective:700px}
  .carta .face{
    position:absolute; inset:0; border-radius:20px; display:flex; align-items:center; justify-content:center;

  /* ---------- feedback / fim ---------- */
  .aviso{
    position:fixed; left:50%; top:14%; transform:translate(-50%,-20px); z-index:20;

    box-shadow:0 10px 30px rgba(0,0,0,.2); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;

  #fim{align-items:center; justify-content:center; text-align:center; gap:14px; padding:24px;
       background:linear-gradient(160deg,#FFD86F,#FC9842)}
  #fim .trofeu{font-size:clamp(70px,22vw,130px); animation:tada 1s infinite}
  #fim h2{font-size:clamp(26px,8vw,44px); margin:0; color:#6b3d00; max-width:16ch}
  #fim p{font-size:clamp(16px,4.4vw,23px); margin:0; color:#7a4a00; font-weight:700; max-width:20ch; line-height:1.3}
  .linha-botoes{display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:10px}
  .btn2{background:#fff; color:var(--roxo); font-weight:800; font-size:clamp(16px,4.4vw,20px);
        padding:16px 24px; border-radius:999px; box-shadow:0 6px 0 rgba(0,0,0,.15)}
  .btn2:active{transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.15)}

  .confete{position:fixed; top:-20px; font-size:24px; z-index:15; pointer-events:none; animation:cair linear forwards}
  @keyframes cair{to{transform:translateY(110vh) rotate(720deg); opacity:.2}}

  .rodape{text-align:center; font-size:12px; opacity:.5; padding:8px}
  .sw{display:flex; align-items:center; gap:6px; font-size:14px; font-weight:700; color:var(--roxo);
      background:#EDE9FF; padding:9px 12px; border-radius:999px}
  #vozes{padding-top:14px}
  #vozes .topo{padding:0 14px}
  .vozes-corpo{flex:1; overflow-y:auto; padding:0 14px 20px; display:flex; flex-direction:column; gap:12px}
  .velocidade{display:flex; gap:8px; justify-content:center; flex-wrap:wrap}
  .vel{background:#EDE9FF; color:var(--roxo); font-weight:800; border-radius:999px;
       padding:10px 16px; font-size:clamp(13px,3.8vw,16px)}
  .vel.on{background:var(--roxo); color:#fff}
  .lista-vozes{display:flex; flex-direction:column; gap:10px; max-width:560px; width:100%; margin:0 auto}
  .cartao-voz{
    display:grid; grid-template-columns:1fr auto auto; gap:10px; align-items:center;
    background:#fff; border-radius:20px; padding:12px 14px; box-shadow:0 5px 0 rgba(0,0,0,.1);
    outline:3px solid transparent;
  }
  .cartao-voz.on{outline-color:var(--roxo); background:#F6F3FF}
  .cv-nome{font-weight:800; font-size:clamp(14px,4vw,17px); line-height:1.2; text-align:left; min-width:0;
           overflow:hidden; text-overflow:ellipsis}
  .cv-selo{font-size:11.5px; font-weight:800; opacity:.8; display:block; margin-top:2px}
  .cv-selo.bom{color:#12794a} .cv-selo.ruim{color:#b34}
  .cv-btn{background:#EDE9FF; color:var(--roxo); border-radius:14px; padding:10px 12px;
          font-size:18px; font-weight:800}
  .cv-btn.usar{background:var(--verde); color:#fff}
  .dica-voz{
    background:#FFF4D1; color:#7a5a10; border-radius:18px; padding:14px 16px; max-width:560px;
    width:100%; margin:0 auto; font-size:clamp(12.5px,3.6vw,15px); line-height:1.45; text-align:left;
  }
  .dica-voz b{color:#5a4200}
  .selvoz{
    font-family:inherit; font-size:12.5px; font-weight:700; color:var(--roxo); background:#EDE9FF;
    border:none; border-radius:999px; padding:10px 8px; max-width:32vw; appearance:none;
  }
  .sw{font-size:18px; padding:9px 13px}
</style>
</head>
<body>

<div class="aviso" id="aviso"></div>

<script>
(function(){
"use strict";

/* ============ utilidades ============ */
const $ = s => document.querySelector(s);
const rnd = n => Math.floor(Math.random()*n);
const escolha = a => a[rnd(a.length)];
const embaralhar = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=rnd(i+1);[b[i],b[j]]=[b[j],b[i]];} return b; };
const espera = ms => new Promise(r=>setTimeout(r,ms));
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// timers dos jogos com tempo (corrida / mira) — sempre limpos ao trocar de tela
let timers = [], intervalos = [];
function agendar(fn, ms){ const t=setTimeout(fn,ms); timers.push(t); return t; }
function repetir(fn, ms){ const t=setInterval(fn,ms); intervalos.push(t); return t; }
function limparTimers(){
  timers.forEach(clearTimeout); timers = [];
  intervalos.forEach(clearInterval); intervalos = [];
  corridaAtiva = false;
  if(typeof pararCena === 'function') pararCena();
}

function mostrarTela(id){
  document.querySelectorAll('.tela').forEach(t=>t.classList.remove('ativa'));
  $('#'+id).classList.add('ativa');
  document.querySelectorAll('.confete').forEach(c=>c.remove());
  if(id !== 'jogo'){ limparTimers(); const p = $('#palco'); if(p) p.innerHTML = ''; }
  window.scrollTo(0,0);
}

/* ============ som ============ */
let ctx=null, mudo=false;
function audio(){
  if(!ctx){ try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(ctx.state==='suspended') ctx.resume();
  return ctx;
}
function tocar(freqs, dur=0.14, tipo='sine', vol=0.18){
  if(mudo) return;
  const c = audio(); if(!c) return;
  freqs.forEach((f,i)=>{
    const o=c.createOscillator(), g=c.createGain();
    o.type=tipo; o.frequency.value=f;
    const t0=c.currentTime + i*dur;
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(vol,t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0+dur+0.02);
  });
}
const somAcerto = ()=>tocar([523,659,784,1047],0.12,'triangle',0.22);
const somErro   = ()=>tocar([300,220],0.16,'sine',0.15);
const somToque  = ()=>tocar([660],0.06,'square',0.08);
const somFesta  = ()=>tocar([523,659,784,1047,1319,1047,1319],0.13,'triangle',0.2);
// ruído branco filtrado: serve de chuveiro, espuma e secador
function somRuido(dur=0.9, corte=1200, vol=0.13){
  if(mudo) return;
  const c = audio(); if(!c) return;
  const n = Math.floor(c.sampleRate*dur);
  const buf = c.createBuffer(1, n, c.sampleRate);
  const dados = buf.getChannelData(0);
  for(let i=0;i<n;i++) dados[i] = (Math.random()*2-1);
  const src = c.createBufferSource(); src.buffer = buf;
  const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = corte; f.Q.value = 0.8;
  const g = c.createGain();
  g.gain.setValueAtTime(0, c.currentTime);
  g.gain.linearRampToValueAtTime(vol, c.currentTime+0.08);
  g.gain.linearRampToValueAtTime(0.0001, c.currentTime+dur);
  src.connect(f); f.connect(g); g.connect(c.destination);
  src.start(); src.stop(c.currentTime+dur+0.05);
}
const somChuveiro = ()=>somRuido(1.0, 2600, 0.12);
const somEspuma   = ()=>{ somRuido(0.7, 900, 0.10); tocar([880,1180,1480],0.07,'sine',0.09); };
const somSecador  = ()=>somRuido(1.1, 700, 0.13);
const somPente    = ()=>tocar([1400,1150,1500],0.045,'square',0.07);

/* ============ voz (pt-BR, feminina e alegre) ============ */
let vozLigada = true;
let vozEscolhida = null;
let vozesPt = [];

const NOMES_FEM = /luciana|francisca|maria|joana|in[eê]s|fernanda|camila|helena|leticia|let[ií]cia|thalita|catarina|raquel|brenda|giovanna|yara|female|mulher/i;
const NOMES_MASC = /daniel|ricardo|felipe|ant[oô]nio|j[uú]lio|heitor|donato|f[aá]bio|duarte|male|masculin|homem/i;
const MELHORES = /premium|enhanced|aprimorad|melhorad|neural|natural|siri|wavenet|studio|hd\b/i;

function pontuarVoz(v){
  const nome = (v.name||'');
  let p = 0;
  if(/pt[-_]BR/i.test(v.lang)) p += 100;
  else if(/^pt/i.test(v.lang)) p += 45;
  else return -1;
  // qualidade pesa mais que qualquer outra coisa: é o que tira o som de robô
  if(MELHORES.test(nome)) p += 70;
  if(v.localService === false) p += 55;   // vozes online (Google/Microsoft) são bem mais naturais
  if(/google/i.test(nome)) p += 30;
  if(NOMES_FEM.test(nome)) p += 25;
  if(NOMES_MASC.test(nome)) p -= 60;
  if(/compact|compacta|comprimid|eloquence/i.test(nome)) p -= 45;
  return p;
}
function selo(v){
  const n = v.name || '';
  if(MELHORES.test(n)) return {t:'✨ Aprimorada', c:'bom'};
  if(/google/i.test(n) || v.localService === false) return {t:'🌐 Online', c:'bom'};
  if(/compact|compacta|comprimid/i.test(n)) return {t:'📻 Comprimida', c:'ruim'};
  return {t:'🔈 Padrão', c:''};
}
function carregarVozes(){
  if(!('speechSynthesis' in window)) return;
  const todas = speechSynthesis.getVoices() || [];
  vozesPt = todas.filter(v=>/^pt/i.test(v.lang)).sort((a,b)=>pontuarVoz(b)-pontuarVoz(a));
  if(vozesPt.length && (!vozEscolhida || !vozesPt.some(v=>v.name===vozEscolhida.name))) vozEscolhida = vozesPt[0];
  montarSeletorVoz();
}
function montarSeletorVoz(){
  if($('#vozes').classList.contains('ativa')) desenharVozes();
}

const FRASE_TESTE = 'Oi! Eu sou a sua amiga dos jogos. Vamos brincar de contar? Um, dois, três!';
const VELOCIDADES = [
  {n:'🐢 Devagar', v:0.88}, {n:'🙂 Normal', v:1.0}, {n:'🐇 Rápida', v:1.12}
];

function dicaDoAparelho(){
  const ua = navigator.userAgent || '';
  if(/iPhone|iPad|iPod/i.test(ua)) return `
    <b>Para a voz ficar bem melhor no iPhone:</b><br>
    Ajustes → Acessibilidade → Conteúdo Falado → <b>Vozes</b> → Português (Brasil) →
    baixe a <b>Luciana (Aprimorada)</b> ou <b>(Premium)</b>. Depois volte aqui e escolha
    a voz com o selo ✨ Aprimorada. A voz que já vem instalada é a comprimida — é ela
    que soa robótica, e nenhum site consegue melhorar isso por conta própria.`;
  if(/Android/i.test(ua)) return `
    <b>Para a voz ficar bem melhor no Android:</b><br>
    Configurações → Sistema → Idiomas → <b>Saída de texto para voz</b> → use o
    <b>Serviço de voz do Google</b> e instale os dados de voz em Português (Brasil).
    Depois volte aqui e escolha a voz com o selo 🌐 Online.`;
  if(/Windows/i.test(ua)) return `
    <b>Para a voz ficar bem melhor no Windows:</b><br>
    Configurações → Hora e Idioma → Fala → <b>Adicionar vozes</b> → Português (Brasil).
    No Chrome, as vozes <b>Google</b> (selo 🌐 Online) costumam ser as mais naturais.`;
  return `<b>Dica:</b> as vozes com selo ✨ Aprimorada ou 🌐 Online são as mais naturais.
    As comprimidas 📻 vêm instaladas de fábrica e são as que soam robóticas.`;
}

function abrirVozes(){
  carregarVozes();
  mostrarTela('vozes');
  desenharVozes();
}
function desenharVozes(){
  const lista = $('#listaVozes'); if(!lista) return;
  $('#velocidade').innerHTML = VELOCIDADES.map(v=>
    `<button class="vel${Math.abs(taxaVoz-v.v)<0.01?' on':''}" data-v="${v.v}">${v.n}</button>`).join('');
  $('#velocidade').querySelectorAll('.vel').forEach(b=>b.onclick=()=>{
    taxaVoz = +b.dataset.v; somToque(); desenharVozes();
    vozLigada = true; falar(FRASE_TESTE, false);
  });

  if(!vozesPt.length){
    lista.innerHTML = `<div class="cartao-voz"><span class="cv-nome">Nenhuma voz em português encontrada neste aparelho.</span></div>`;
  }else{
    lista.innerHTML = vozesPt.map((v,i)=>{
      const s = selo(v);
      const atual = vozEscolhida && vozEscolhida.name === v.name;
      return `<div class="cartao-voz${atual?' on':''}">
        <span class="cv-nome">${esc(v.name)}<span class="cv-selo ${s.c}">${s.t} · ${esc(v.lang)}</span></span>
        <button class="cv-btn" data-ouvir="${i}" aria-label="Ouvir">▶️</button>
        <button class="cv-btn ${atual?'usar':''}" data-usar="${i}" aria-label="Usar esta voz">${atual?'✓':'Usar'}</button>
      </div>`;
    }).join('');
    lista.querySelectorAll('[data-ouvir]').forEach(b=>b.onclick=()=>{
      const v = vozesPt[+b.dataset.ouvir];
      const antes = vozEscolhida; vozEscolhida = v; vozLigada = true;
      falar(FRASE_TESTE, false);
      if(!(vozEscolhida && antes && antes.name === v.name)) { /* mantém para ouvir */ }
      desenharVozes();
    });
    lista.querySelectorAll('[data-usar]').forEach(b=>b.onclick=()=>{
      vozEscolhida = vozesPt[+b.dataset.usar];
      vozLigada = true; mudo = false;
      $('#btnVoz').textContent = '🔊';
      somToque();
      falar('Pronto! Agora eu falo assim.', false, 'festa');
      desenharVozes();
    });
  }
  $('#dicaVoz').innerHTML = dicaDoAparelho();
}
if('speechSynthesis' in window){
  carregarVozes();
  speechSynthesis.onvoiceschanged = carregarVozes;
}

let ultimaFala = '';
let taxaVoz = 1.0;   // 0.88 devagar · 1.0 normal · 1.12 rápida

// Tons próximos da fala normal. Pitch alto soa "desenho animado" nas vozes
// compactas do celular e é o que mais dá sensação de robô — por isso ficamos perto de 1.
const TONS = {
  normal: {rate:1.00, pitch:1.06},
  festa:  {rate:1.04, pitch:1.16},
  calmo:  {rate:0.94, pitch:1.00}
};

// deixa o texto mais "falável": números viram palavras, símbolos viram pausa
const NUM_FALA = ['zero','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez',
  'onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove','vinte'];
function textoFalavel(t){
  return String(t)
    .replace(/×/g,' vezes ').replace(/÷/g,' dividido por ')
    .replace(/\s\+\s/g,' mais ').replace(/\s−\s|\s-\s/g,' menos ')
    .replace(/\b(\d{1,2})\b/g, (m,n)=> (+n <= 20 ? NUM_FALA[+n] : m))
    .replace(/\s{2,}/g,' ')
    .trim();
}

function falar(texto, guardar=true, tom='normal'){
  if(guardar) ultimaFala = texto;
  if(mudo || !vozLigada || !('speechSynthesis' in window) || !texto) return;
  try{
    speechSynthesis.cancel();
    const t = TONS[tom] || TONS.normal;
    const limpo = textoFalavel(texto);
    // uma fala só (menos cortes = menos "robô"); só quebra se for bem longa
    const partes = limpo.length <= 110
      ? [limpo]
      : (limpo.match(/[^.!?]+[.!?]*/g) || [limpo]).map(x=>x.trim()).filter(Boolean);
    partes.forEach(parte=>{
      const u = new SpeechSynthesisUtterance(parte);
      u.lang = 'pt-BR';
      try{ if(vozEscolhida) u.voice = vozEscolhida; }catch(e){}
      u.rate = Math.max(0.6, Math.min(1.4, t.rate * taxaVoz));
      u.pitch = t.pitch;
      speechSynthesis.speak(u);
    });
  }catch(e){}
}
function destravarVoz(){
  if(!('speechSynthesis' in window)) return;
  try{ const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u); }catch(e){}
  carregarVozes();
  setTimeout(carregarVozes, 400);
  setTimeout(carregarVozes, 1500);
}

/* ============ feedback visual ============ */
let timerAviso=null;
function aviso(txt, bom=true){
  const el=$('#aviso');
  el.textContent=txt;
  el.className='aviso mostra '+(bom?'bom':'ops');
  clearTimeout(timerAviso);
  timerAviso=setTimeout(()=>el.classList.remove('mostra'),1100);
}
function confete(qtd=26){
  const emo=['🎉','⭐','🎊','✨','🌟','🎈'];
  for(let i=0;i<qtd;i++){
    const d=document.createElement('div');

async function responder(botao, certo, fala){

// gera distratores numéricos próximos do valor certo
function distratores(certo, qtd, min, max){
  const s = new Set([certo]);
  let tentativas = 0;
  while(s.size < qtd+1 && tentativas < 200){
    tentativas++;
    let d = certo + (rnd(2)?1:-1) * (1 + rnd(Math.max(3, Math.round(Math.abs(certo)*0.25))));
    if(d < min) d = min + rnd(3);
    if(d > max) d = max - rnd(3);
    if(Number.isFinite(d)) s.add(d);
  }
  let n = min;
  while(s.size < qtd+1){ if(!s.has(n)) s.add(n); n++; }
  const arr = [...s].filter(v=>v!==certo).slice(0,qtd);
  return embaralhar([certo, ...arr]);
}

/* ============ 8-11: SEQUÊNCIA NUMÉRICA ============ */
function jogoSequencia(){
  const tipo = escolha(['soma','subtrai','dobra','quadrados','fib']);
  let seq = [], dica = '';
  if(tipo==='soma'){
    const ini = 1+rnd(12), passo = 2+rnd(8);
    for(let i=0;i<6;i++) seq.push(ini + i*passo);
    dica = `A regra é somar ${passo} a cada passo.`;
  }else if(tipo==='subtrai'){
    const passo = 2+rnd(7), ini = 60+rnd(40);
    for(let i=0;i<6;i++) seq.push(ini - i*passo);
    dica = `A regra é tirar ${passo} a cada passo.`;
  }else if(tipo==='dobra'){
    const ini = 1+rnd(4);
    for(let i=0;i<6;i++) seq.push(ini * Math.pow(2,i));
    dica = 'A regra é dobrar o número anterior.';
  }else if(tipo==='quadrados'){
    const ini = 1+rnd(3);
    for(let i=0;i<6;i++){ const n = ini+i; seq.push(n*n); }
    dica = 'São os números multiplicados por eles mesmos.';
  }else{
    seq = [1,1,2,3,5,8,13];
    dica = 'Cada número é a soma dos dois anteriores.';
  }
  const resposta = seq[5] !== undefined ? seq[5] : seq[seq.length-1];
  const mostrados = seq.slice(0,5);
  const ops = distratores(resposta, 3, 1, Math.max(20, resposta*2));
  $('#palco').innerHTML = `
    <div class="pergunta">Qual é o próximo número?</div>
    <div class="sequencia">${mostrados.map(s=>`<span class="item num">${s}</span>`).join('')}<span class="item num vazio">?</span></div>
    <div class="opcoes num">${ops.map(v=>`<button class="op" data-v="${v}">${v}</button>`).join('')}</div>`;
  falar('Olhe a sequência. Qual é o próximo número?');
  ligarOpcoes(resposta, dica);
}

/* ==========================================================
   MOTOR DE FÍSICA SIMPLES (caixas com impulso e destruição)
   Mundo fixo de 800 x 450 unidades, desenhado em canvas.
   ========================================================== */
const MUNDO_L = 800, MUNDO_A = 450, CHAO_Y = 396, GRAV = 900;
let corpos = [], estilhacos = [], raf = null, cenaViva = false;

function corpo(o){
  return Object.assign({
    x:0, y:0, w:20, h:20, vx:0, vy:0,
    estatico:false, massa:1, hp:Infinity, tipo:'bloco',
    cor:'#C08A4E', emoji:null, ang:0, vang:0, vivo:true, dormindo:false
  }, o);
}
const meiaL = b => b.w/2, meiaA = b => b.h/2;

function resolverPar(a, b){
  if(a.estatico && b.estatico) return 0;
  const dx = b.x - a.x, px = meiaL(a) + meiaL(b) - Math.abs(dx);
  if(px <= 0) return 0;
  const dy = b.y - a.y, py = meiaA(a) + meiaA(b) - Math.abs(dy);
  if(py <= 0) return 0;

  let nx = 0, ny = 0, pen;
  if(px < py){ nx = dx < 0 ? -1 : 1; pen = px; }
  else       { ny = dy < 0 ? -1 : 1; pen = py; }

  const ima = a.estatico ? 0 : 1/a.massa;
  const imb = b.estatico ? 0 : 1/b.massa;
  const soma = ima + imb;
  if(soma === 0) return 0;

  const corr = (pen/soma) * 0.8;
  a.x -= nx*corr*ima; a.y -= ny*corr*ima;
  b.x += nx*corr*imb; b.y += ny*corr*imb;

  const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
  const vn = rvx*nx + rvy*ny;
  if(vn > 0) return 0;

  const e = 0.14;
  const j = -(1+e)*vn/soma;
  a.vx -= j*nx*ima; a.vy -= j*ny*ima;
  b.vx += j*nx*imb; b.vy += j*ny*imb;

  const tx = -ny, ty = nx;
  const vt = rvx*tx + rvy*ty;
  const jt = (-vt/soma) * 0.45;
  a.vx -= jt*tx*ima; a.vy -= jt*ty*ima;
  b.vx += jt*tx*imb; b.vy += jt*ty*imb;

  a.dormindo = b.dormindo = false;
  return Math.abs(vn);
}

// dano por impacto: devolve true se algo foi destruído
function aplicarDano(a, b, forca){
  let quebrou = false;
  [a,b].forEach(c=>{
    if(c.estatico || !Number.isFinite(c.hp)) return;
    if(forca > 130){
      c.hp -= (forca - 130)/70;
      if(c.hp <= 0 && c.vivo){ c.vivo = false; quebrou = true; espalhar(c); }
    }
  });
  return quebrou;
}
function espalhar(c){
  for(let i=0;i<10;i++){
    estilhacos.push({
      x:c.x + (Math.random()-0.5)*c.w, y:c.y + (Math.random()-0.5)*c.h,
      vx:(Math.random()-0.5)*260, vy:-Math.random()*260,
      t:6+Math.random()*8, ang:Math.random()*6, vang:(Math.random()-0.5)*14,
      cor:c.cor, vida:1
    });
  }
}

function passoFisica(dt){
  for(const b of corpos){
    if(b.estatico || !b.vivo || b.dormindo) continue;
    b.vy += GRAV*dt;
    b.x += b.vx*dt;
    b.y += b.vy*dt;
    b.vx *= 0.999;
    b.ang += b.vang*dt;
  }
  const vivos = corpos.filter(b=>b.vivo);
  for(let it=0; it<4; it++){
    for(let i=0;i<vivos.length;i++){
      for(let j=i+1;j<vivos.length;j++){
        const f = resolverPar(vivos[i], vivos[j]);
        if(f > 0 && it === 0) aplicarDano(vivos[i], vivos[j], f);
      }
    }
  }
  for(const b of corpos){
    if(b.estatico || !b.vivo) continue;
    if(Math.abs(b.vx) < 4 && Math.abs(b.vy) < 4) b.vx *= 0.86;
    if(b.y > MUNDO_A + 200) b.vivo = false;
  }
  for(let i=estilhacos.length-1;i>=0;i--){
    const p = estilhacos[i];
    p.vy += GRAV*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.ang += p.vang*dt;
    p.vida -= dt*0.8;
    if(p.vida <= 0 || p.y > MUNDO_A + 60) estilhacos.splice(i,1);
  }
}
function tudoParado(){
  return corpos.every(b => b.estatico || !b.vivo || (Math.abs(b.vx) < 14 && Math.abs(b.vy) < 14));
}

/* ---------- desenho ---------- */
function ctxDaCena(){
  const cv = $('#tela'); if(!cv) return null;
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const lp = Math.round(r.width*dpr), ap = Math.round(r.width*dpr*MUNDO_A/MUNDO_L);
  if(cv.width !== lp || cv.height !== ap){ cv.width = lp; cv.height = ap; }
  const ctx = cv.getContext('2d');
  const s = cv.width/MUNDO_L;
  ctx.setTransform(s,0,0,s,0,0);
  return ctx;
}
function fundo(ctx, noite){
  const g = ctx.createLinearGradient(0,0,0,CHAO_Y);
  if(noite){ g.addColorStop(0,'#243B7A'); g.addColorStop(1,'#6C7FD6'); }
  else { g.addColorStop(0,'#7FC7F5'); g.addColorStop(1,'#CDEBFF'); }
  ctx.fillStyle = g; ctx.fillRect(0,0,MUNDO_L,CHAO_Y);
  ctx.fillStyle = noite ? '#FFF7C2' : '#FFE45E';
  ctx.beginPath(); ctx.arc(700,62,30,0,7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  [[120,70,26],[160,74,20],[430,52,22],[466,56,17]].forEach(([x,y,r])=>{
    ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
  });
  ctx.fillStyle = '#4CAF50'; ctx.fillRect(0,CHAO_Y,MUNDO_L,20);
  ctx.fillStyle = '#8D6E63'; ctx.fillRect(0,CHAO_Y+20,MUNDO_L,MUNDO_A-CHAO_Y-20);
}
function caixaArredondada(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function desenharCorpos(ctx){
  for(const b of corpos){
    if(!b.vivo || b.tipo === 'chao') continue;
    ctx.save();
    ctx.translate(b.x, b.y); ctx.rotate(b.ang);
    if(b.emoji){
      ctx.font = `${Math.max(b.w,b.h)*1.15}px serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(b.emoji, 0, 1);
    }else{
      ctx.fillStyle = b.cor;
      caixaArredondada(ctx, -b.w/2, -b.h/2, b.w, b.h, Math.min(6, b.w/3, b.h/3));
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.16)'; ctx.lineWidth = 2; ctx.stroke();
    }
    ctx.restore();
  }
  for(const p of estilhacos){
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.ang);
    ctx.globalAlpha = Math.max(0, p.vida);
    ctx.fillStyle = p.cor; ctx.fillRect(-p.t/2,-p.t/2,p.t,p.t);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}
function pontoDoEvento(ev){
  const cv = $('#tela'); if(!cv) return {x:0,y:0};
  const r = cv.getBoundingClientRect();
  const t = ev.touches && ev.touches[0] ? ev.touches[0] : ev;
  return { x:(t.clientX - r.left)/r.width*MUNDO_L, y:(t.clientY - r.top)/r.width*MUNDO_L };
}
function pararCena(){
  cenaViva = false;
  if(raf) cancelAnimationFrame(raf);
  raf = null;
}
function rodarCena(quadro){
  cenaViva = true;
  let anterior = performance.now();
  const laco = (agora)=>{
    if(!cenaViva) return;
    let dt = (agora - anterior)/1000; anterior = agora;
    dt = Math.min(dt, 0.033);
    quadro(dt);
    raf = requestAnimationFrame(laco);
  };
  raf = requestAnimationFrame(laco);
}

function montarFase(n, facil){

  const base = CHAO_Y;

  if(n === 0){

  }else if(n === 1){

  estBolas = (facil ? 8 : 6);

}
function porcosVivos(){ return corpos.filter(b=>b.tipo==='porco' && b.vivo).length; }
function novaBola(){
  estBola = corpo({x:ANC.x, y:ANC.y, w:30, h:30, tipo:'bola', emoji:'🐤', massa:1.6, estatico:true});
  estBola.vivo = true;
  corpos.push(estBola);
  estPonta = {x:ANC.x, y:ANC.y};
  estEsperando = false;
  atualizarHudEstilingue();
}
function atualizarHudEstilingue(){
  const h = $('#hudEst');
  if(h) h.innerHTML = `<span class="chip">Fase ${estFase+1}/3</span>
    <span class="chip">🐤 ${estBolas}</span>
    <span class="chip">🐷 ${porcosVivos()}</span>`;
  $('#barraProg').style.width = ((estFase)/3*100) + '%';
}

function jogoEstilingue(facil){
  estFacil = facil; estFase = 0; maxPontos = 9;
  $('#palco').className = 'palco compacto';
  $('#palco').innerHTML = `
    <div class="pergunta">Derrube os porquinhos!</div>
    <div class="subtexto">Puxe para trás e solte para atirar</div>
    <canvas class="cena" id="tela"></canvas>
    <div class="hud" id="hudEst"></div>`;
  falar('Puxe o passarinho para trás e solte para derrubar os porquinhos!');
  montarFase(0, facil);
  ligarEstilingue();
  rodarCena(quadroEstilingue);
}
function ligarEstilingue(){
  const cv = $('#tela');
  const inicio = ev=>{
    if(!estBola || !estBola.estatico || estEsperando) return;
    ev.preventDefault();
    try{ cv.setPointerCapture(ev.pointerId); }catch(e){}
    estPuxando = true; mover(ev);
  };
  const mover = ev=>{
    if(!estPuxando) return;
    ev.preventDefault();
    const p = pontoDoEvento(ev);
    let dx = p.x - ANC.x, dy = p.y - ANC.y;
    const d = Math.hypot(dx,dy), max = 78;
    if(d > max){ dx = dx/d*max; dy = dy/d*max; }
    estPonta = {x:ANC.x+dx, y:ANC.y+dy};
    if(estBola){ estBola.x = estPonta.x; estBola.y = estPonta.y; }
  };
  const soltar = ev=>{
    if(!estPuxando) return;
    ev.preventDefault(); estPuxando = false;
    const dx = ANC.x - estPonta.x, dy = ANC.y - estPonta.y;
    if(Math.hypot(dx,dy) < 12){ estBola.x = ANC.x; estBola.y = ANC.y; estPonta = {x:ANC.x,y:ANC.y}; return; }
    estBola.estatico = false;
    estBola.vx = dx*FORCA_EST; estBola.vy = dy*FORCA_EST;
    estBola.vang = dx*0.05;
    estBolas--;
    estEsperando = true;
    tocar([300,520],0.09,'sine',0.16);
    atualizarHudEstilingue();
    agendar(()=>{ if(cenaViva) verificarEstilingue(0); }, 2000);
  };
  cv.addEventListener('pointerdown', inicio);
  cv.addEventListener('pointermove', mover);
  cv.addEventListener('pointerup', soltar);
  cv.addEventListener('pointercancel', soltar);
}
let estPorcosAntes = -1;
function quadroEstilingue(dt){
  passoFisica(dt);
  const ctx = ctxDaCena(); if(!ctx) return;
  fundo(ctx, false);
  // estilingue
  ctx.strokeStyle = '#8D6E63'; ctx.lineWidth = 9; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(ANC.x, CHAO_Y); ctx.lineTo(ANC.x, ANC.y+6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ANC.x, ANC.y+14); ctx.lineTo(ANC.x-16, ANC.y-6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ANC.x, ANC.y+14); ctx.lineTo(ANC.x+16, ANC.y-6); ctx.stroke();
  if(estBola && estBola.estatico){
    ctx.strokeStyle = '#5D4037'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(ANC.x-16, ANC.y-6); ctx.lineTo(estBola.x, estBola.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ANC.x+16, ANC.y-6); ctx.lineTo(estBola.x, estBola.y); ctx.stroke();
    if(estPuxando){
      const vx = (ANC.x-estBola.x)*FORCA_EST, vy = (ANC.y-estBola.y)*FORCA_EST;
      ctx.fillStyle = 'rgba(255,255,255,.75)';
      for(let i=1;i<=14;i++){
        const t = i*0.055;
        const px = estBola.x + vx*t, py = estBola.y + vy*t + 0.5*GRAV*t*t;
        if(py > CHAO_Y) break;
        ctx.beginPath(); ctx.arc(px,py, 4 - i*0.13, 0, 7); ctx.fill();
      }
    }
  }
  desenharCorpos(ctx);

  const vivos = porcosVivos();
  if(estPorcosAntes < 0) estPorcosAntes = vivos;
  if(vivos < estPorcosAntes){
    const ganhos = estPorcosAntes - vivos;
    estPorcosAntes = vivos;
    estrelas += ganhos; estEstrelasFase += ganhos;
    $('#placar').textContent = '⭐ ' + estrelas;
    somAcerto(); confete(10); atualizarHudEstilingue();
  }
  if(estEsperando && vivos === 0){
    estEsperando = false;
    pararCena();
    aviso('Fase vencida! 🏆', true);
    falar('Você derrubou todos! Muito bem!', false, 'festa');
    confete(26);
    agendar(()=>{
      estFase++;
      if(estFase >= 3){ fimDeJogo(); return; }
      estPorcosAntes = -1;
      montarFase(estFase, estFacil);
      rodarCena(quadroEstilingue);
    }, 1800);
  }
}
function verificarEstilingue(tentativas){
  tentativas = tentativas || 0;
  if(!estEsperando || porcosVivos() === 0) return;
  if(!tudoParado() && tentativas < 6){
    agendar(()=>{ if(cenaViva) verificarEstilingue(tentativas+1); }, 600);
    return;
  }
  if(estBola){ estBola.vivo = false; }
  if(estBolas > 0){ novaBola(); return; }
  // acabou as bolinhas: repete a fase sem perder o que já era
  pararCena();
  aviso('Vamos tentar de novo!', false);
  falar('Acabaram os passarinhos. Vamos tentar de novo!', false, 'calmo');
  estrelas -= estEstrelasFase;
  if(estrelas < 0) estrelas = 0;
  $('#placar').textContent = '⭐ ' + estrelas;
  agendar(()=>{
    estPorcosAntes = -1;
    montarFase(estFase, estFacil);
    rodarCena(quadroEstilingue);
  }, 1700);
}

/* ==========================================================
   DUELO DE CANHÕES  (jogador x computador)
   ========================================================== */
const D_EU = {x:168}, D_PC = {x:632};
let dRoboAgendado = false;
const NIVEIS_DUELO = [
  {id:'facil',   nome:'Fácil',   ico:'😀', erroV:0.32, erroA:0.30, vidaEu:4, vidaPc:2, desc:'O robô erra bastante'},
  {id:'medio',   nome:'Médio',   ico:'😎', erroV:0.16, erroA:0.15, vidaEu:3, vidaPc:3, desc:'Duelo parelho'},
  {id:'dificil', nome:'Difícil', ico:'😈', erroV:0.055,erroA:0.05, vidaEu:3, vidaPc:4, desc:'O robô quase não erra'}
];
let dNivel = NIVEIS_DUELO[0];
let dVida = {eu:3, pc:3}, dVez = 'eu', dTiro = null, dPuxando = false,
    dPonta = {x:0,y:0}, dDuelo = 0, dFacil = true, dFimDeDuelo = false;

function baseCanhao(){ return CHAO_Y - 26; }
function montarDuelo(){
  corpos = []; estilhacos = [];
  corpos.push(corpo({x:MUNDO_L/2, y:CHAO_Y+120, w:MUNDO_L*3, h:240, estatico:true, tipo:'chao'}));

  corpos.push(corpo({x:400, y:CHAO_Y-50, w:52, h:100, estatico:true, cor:'#7E9B57', tipo:'morro'}));
  corpos.push(corpo({x:D_EU.x, y:baseCanhao(), w:52, h:52, estatico:true, cor:'#5B8DEF', tipo:'torreEu'}));
  corpos.push(corpo({x:D_PC.x, y:baseCanhao(), w:52, h:52, estatico:true, cor:'#E05C5C', tipo:'torrePc'}));
  dTiro = null; dPonta = {x:D_EU.x, y:baseCanhao()-50};
  dFimDeDuelo = false;
}
function atualizarHudDuelo(){

  if(!h) return;
  const p = n => n === 1 ? '1 acerto' : n + ' acertos';
  h.innerHTML = `

    <span class="chip alvo-eu">🎯 Faltam <b>${p(dVida.pc)}</b> para você ganhar</span>
    <span class="chip alvo-pc">🤖 Faltam <b>${p(dVida.eu)}</b> para o robô ganhar</span>
    <span class="chip">${dNivel.ico} ${dNivel.nome} · Duelo ${Math.min(dDuelo+1,3)}/3</span>
    <span class="chip vez">${dFimDeDuelo ? '⏳' : (dVez === 'eu' ? '👉 Sua vez!' : '🤖 Vez do robô')}</span>`;
}
function jogoDuelo(facil){
  dFacil = facil; dDuelo = 0; maxPontos = 3;
  pararCena();
  $('#palco').className = 'palco compacto';
  $('#palco').innerHTML = `
    <div class="pergunta">Escolha a dificuldade</div>
    <div class="niveis">${NIVEIS_DUELO.map((n,i)=>`
      <button class="nivel" data-n="${i}">
        <span class="ni">${n.ico}</span>
        <span class="nn">${n.nome}</span>
        <span class="nd">${n.desc}</span>
        <span class="nv">🧒 ${'❤️'.repeat(n.vidaEu)} &nbsp;·&nbsp; 🤖 ${'❤️'.repeat(n.vidaPc)}</span>
      </button>`).join('')}</div>`;
  falar('Escolha a dificuldade: fácil, médio ou difícil.');
  $('#palco').querySelectorAll('.nivel').forEach(b=>b.onclick=()=>{
    somToque();
    dNivel = NIVEIS_DUELO[+b.dataset.n];
    comecarDuelo();

}
function comecarDuelo(){
  dDuelo = 0; maxPontos = 3;
  $('#palco').className = 'palco compacto';
  $('#palco').innerHTML = `
    <div class="pergunta">Duelo contra o robô</div>
    <div class="subtexto">Puxe para mirar e solte para atirar</div>
    <canvas class="cena" id="tela"></canvas>

    <button class="btn2" id="btnTrocarNivel">${'⚙️'} Trocar dificuldade</button>`;
  falar(`Dificuldade ${dNivel.nome}. Puxe para mirar e solte para atirar no robô!`);
  novoDuelo();
  ligarDuelo();
  $('#btnTrocarNivel').onclick = ()=>{ somToque(); pararCena(); estrelas = 0; $('#placar').textContent='⭐ 0'; jogoDuelo(dFacil); };
  rodarCena(quadroDuelo);
}
function novoDuelo(){
  dVida = {eu:dNivel.vidaEu, pc:dNivel.vidaPc}; dVez = 'eu'; dRoboAgendado = false;
  montarDuelo();
  atualizarHudDuelo();
  $('#barraProg').style.width = (dDuelo/3*100) + '%';
}
function criarTiro(x, y, vx, vy, dono){
  const t = corpo({x, y, w:18, h:18, tipo:'tiro', emoji: dono==='eu' ? '🔵' : '🔴', massa:1.2});
  t.dono = dono; t.vx = vx; t.vy = vy;
  corpos.push(t); dTiro = t;
  tocar([220,420],0.09,'square',0.14);
}
function ligarDuelo(){
  const cv = $('#tela');
  const inicio = ev=>{
    if(dVez !== 'eu' || dTiro || dFimDeDuelo) return;
    ev.preventDefault();
    try{ cv.setPointerCapture(ev.pointerId); }catch(e){}
    dPuxando = true; mover(ev);
  };
  const mover = ev=>{
    if(!dPuxando) return;
    ev.preventDefault();
    const p = pontoDoEvento(ev);
    const ax = D_EU.x, ay = baseCanhao()-40;
    let dx = p.x-ax, dy = p.y-ay;
    const d = Math.hypot(dx,dy), max = 92;
    if(d > max){ dx = dx/d*max; dy = dy/d*max; }
    dPonta = {x:ax+dx, y:ay+dy};
  };
  const soltar = ev=>{
    if(!dPuxando) return;
    ev.preventDefault(); dPuxando = false;
    const ax = D_EU.x, ay = baseCanhao()-40;
    const dx = ax - dPonta.x, dy = ay - dPonta.y;
    if(Math.hypot(dx,dy) < 12) return;
    criarTiro(ax + (dx>0?26:-26)*0.6, ay-6, dx*FORCA_DUELO, dy*FORCA_DUELO, 'eu');
  };
  cv.addEventListener('pointerdown', inicio);
  cv.addEventListener('pointermove', mover);
  cv.addEventListener('pointerup', soltar);
  cv.addEventListener('pointercancel', soltar);
}
function tiroDoRobo(){
  const ax = D_PC.x, ay = baseCanhao()-46;
  const alvoX = D_EU.x;
  const dist = Math.abs(ax - alvoX);
  const vIdeal = Math.sqrt(dist*GRAV);          // ângulo de 45°, mesma altura
  const erroV = dNivel.erroV * (dFacil ? 1.25 : 1);
  const erroA = dNivel.erroA * (dFacil ? 1.25 : 1);
  const v = vIdeal * (1 + (Math.random()-0.5)*2*erroV);
  const ang = Math.PI/4 * (1 + (Math.random()-0.5)*2*erroA);
  criarTiro(ax-26, ay, -Math.cos(ang)*v, -Math.sin(ang)*v, 'pc');
}
function bateuNoAlvo(alvo, t){
  const b = corpos.find(c=>c.tipo===alvo);
  if(!b) return false;
  return Math.abs(t.x-b.x) < (t.w+b.w)/2 && Math.abs(t.y-b.y) < (t.h+b.h)/2;
}
async function resolverTiro(){
  const t = dTiro;
  const alvo = t.dono === 'eu' ? 'torrePc' : 'torreEu';
  const bateu = bateuNoAlvo(alvo, t);
  const alvoBody = corpos.find(c=>c.tipo===alvo);
  dTiro.vivo = false; dTiro = null;

  if(bateu){
    if(alvoBody) espalhar(alvoBody);
    if(t.dono === 'eu'){
      dVida.pc--; somAcerto(); aviso('Acertou o robô! 🎯', true);
      falar('Acertou o robô!', false, 'festa'); confete(14);
    }else{
      dVida.eu--; somErro(); aviso('O robô te acertou!', false);
      falar('O robô acertou. Sua vez!', false, 'calmo');
    }
    atualizarHudDuelo();
  }else{
    tocar([180,140],0.12,'sine',0.12);
    if(t.dono === 'eu') aviso('Errou! Tenta de novo.', false);
  }

  if(dVida.pc <= 0 || dVida.eu <= 0){
    dFimDeDuelo = true;
    pararCena();
    const ganhou = dVida.pc <= 0;
    if(ganhou){
      estrelas++; $('#placar').textContent = '⭐ ' + estrelas;
      aviso('Você venceu o duelo! 🏆', true);
      falar('Uhul! Você venceu o duelo!', false, 'festa'); confete(30);
    }else{
      aviso('O robô venceu essa!', false);
      falar('O robô venceu essa. Vamos de novo!', false, 'calmo');
    }
    agendar(()=>{
      dDuelo++;
      if(dDuelo >= 3){ fimDeJogo(); return; }
      novoDuelo();
      rodarCena(quadroDuelo);
    }, 2000);
    return;
  }

  dVez = t.dono === 'eu' ? 'pc' : 'eu';
  atualizarHudDuelo();
  if(dVez === 'pc'){
    dRoboAgendado = true;
    agendar(()=>{ dRoboAgendado = false; if(cenaViva && !dFimDeDuelo && dVez==='pc' && !dTiro) tiroDoRobo(); }, 900);
  }
}
function quadroDuelo(dt){
  passoFisica(dt);
  const ctx = ctxDaCena(); if(!ctx) return;
  fundo(ctx, false);

  // canhões
  const desenharCanhao = (x, cor, emoji)=>{
    ctx.fillStyle = cor;
    caixaArredondada(ctx, x-26, baseCanhao()-26, 52, 52, 8); ctx.fill();
    ctx.font = '30px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(emoji, x, baseCanhao()-46);
  };
  desenharCanhao(D_EU.x, '#5B8DEF', '🧒');
  desenharCanhao(D_PC.x, '#E05C5C', '🤖');
  ctx.font = '20px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('❤️'.repeat(dVida.eu) || '💔', D_EU.x, baseCanhao()-78);
  ctx.fillText('❤️'.repeat(dVida.pc) || '💔', D_PC.x, baseCanhao()-78);
  // morro
  ctx.fillStyle = '#7E9B57';
  caixaArredondada(ctx, 374, CHAO_Y-100, 52, 100, 10); ctx.fill();

  if(dPuxando && dVez === 'eu'){
    const ax = D_EU.x, ay = baseCanhao()-40;
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(dPonta.x,dPonta.y); ctx.stroke();
    const vx = (ax-dPonta.x)*FORCA_DUELO, vy = (ay-dPonta.y)*FORCA_DUELO;
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    for(let i=1;i<=18;i++){
      const tt = i*0.05;
      const px = ax + vx*tt, py = ay + vy*tt + 0.5*GRAV*tt*tt;
      if(py > CHAO_Y) break;
      ctx.beginPath(); ctx.arc(px,py, 4-i*0.11, 0, 7); ctx.fill();
    }
  }
  desenharCorpos(ctx);

  // fim do voo do tiro
  if(dTiro && dTiro.vivo){
    const forA = dTiro.x < -40 || dTiro.x > MUNDO_L+40;
    const parou = dTiro.y > CHAO_Y - 12 && Math.abs(dTiro.vy) < 40;
    if(bateuNoAlvo(dTiro.dono==='eu'?'torrePc':'torreEu', dTiro) || forA || parou){
      resolverTiro();
    }
  }
  // turno do robô caso nada esteja voando
  if(dVez === 'pc' && !dTiro && !dFimDeDuelo && !dRoboAgendado){
    dRoboAgendado = true;
    agendar(()=>{ dRoboAgendado = false; if(cenaViva && !dFimDeDuelo && dVez==='pc' && !dTiro) tiroDoRobo(); }, 600);
  }
}

  {n:'coque',   ico:'🎀'}, {n:'chanel', ico:'💇‍♀️'}, {n:'careca', ico:'🧑‍🦲'}
];
const ACESSORIOS = [
  {n:'nenhum', e:null}, {n:'óculos', e:'👓'}, {n:'laço', e:'🎀'},

];

let salao = null, salaoAba = 'cabelo', salaoPedido = null, salaoCliente = 0, salaoDificil = false;

function capaCabelo(cor){
  return `<path d="M38 106 Q38 30 100 30 Q162 30 162 106 Q150 76 100 74 Q50 76 38 106 Z" fill="${cor}"/>`;
}
function desenhoCabelo(estilo, cor){
  if(estilo === 5) return '';                                  // careca
  const capa = capaCabelo(cor);
  if(estilo === 0)  // curto
    return capa;
  if(estilo === 1)  // longo
    return `<path d="M34 96 Q34 26 100 26 Q166 26 166 96 L166 200 Q152 208 146 188 L146 112 Q100 134 54 112 L54 188 Q48 208 34 200 Z" fill="${cor}"/>` + capa;
  if(estilo === 2)  // cachos
    return capa + [[52,72],[74,52],[100,44],[126,52],[148,72],[40,100],[160,100],[46,126],[154,126]]
      .map(([x,y])=>`<circle cx="${x}" cy="${y}" r="17" fill="${cor}"/>`).join('');
  if(estilo === 3)  // coque
    return capa + `<circle cx="100" cy="26" r="24" fill="${cor}"/><circle cx="100" cy="26" r="24" fill="rgba(0,0,0,.08)"/>`;
  // chanel
  return `<path d="M34 96 Q34 26 100 26 Q166 26 166 96 L166 150 Q152 160 146 142 L146 112 Q100 134 54 112 L54 142 Q48 160 34 150 Z" fill="${cor}"/>` + capa;
}

function svgRosto(s, tamanho){
  const olho = (cx)=>`
    <ellipse cx="${cx}" cy="112" rx="14" ry="10" fill="#fff"/>
    <circle cx="${cx}" cy="112" r="7.5" fill="${s.corOlho}"/>
    <circle cx="${cx}" cy="112" r="3.4" fill="#141414"/>
    <circle cx="${cx-2.6}" cy="109.4" r="2" fill="#fff"/>
    <path d="M${cx-15} 106 q15 -9 30 0" stroke="#2B2118" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  const sombra = s.sombra ? `
    <path d="M56 103 q14 -10 28 0 q-14 5 -28 0Z" fill="${s.sombra}" opacity=".75"/>
    <path d="M116 103 q14 -10 28 0 q-14 5 -28 0Z" fill="${s.sombra}" opacity=".75"/>` : '';
  const blush = s.blush ? `
    <ellipse cx="62" cy="134" rx="13" ry="8" fill="${s.blush}" opacity=".6"/>
    <ellipse cx="138" cy="134" rx="13" ry="8" fill="${s.blush}" opacity=".6"/>` : '';
  const acess = s.acess ? `<text x="100" y="${s.acessY||46}" font-size="46" text-anchor="middle">${s.acess}</text>` : '';
  // fios despenteados espetados para fora
  const FIOS = [[64,56,46,26],[86,44,76,14],[112,42,122,12],[138,54,158,28],[52,84,26,68],[150,86,176,72],[100,38,100,8]];
  const nFios = Math.round((s.bagunca||0) * FIOS.length);
  const fios = (nFios > 0 && s.cabelo !== 5)
    ? FIOS.slice(0, nFios).map(([x1,y1,x2,y2])=>
        `<path d="M${x1} ${y1} Q${(x1+x2)/2 + 8} ${(y1+y2)/2 - 6} ${x2} ${y2}" stroke="${s.corCabelo}" stroke-width="6" fill="none" stroke-linecap="round"/>`).join('')
    : '';
  const sj = Math.max(0, Math.min(1, s.sujo||0));
  const sujeira = sj > 0.02 ? `<g fill="#8D6E63" opacity="${(sj*0.55).toFixed(2)}">
    <ellipse cx="70" cy="140" rx="11" ry="6" transform="rotate(-14 70 140)"/>
    <ellipse cx="132" cy="146" rx="9" ry="5" transform="rotate(10 132 146)"/>
    <ellipse cx="104" cy="92" rx="8" ry="5" transform="rotate(-8 104 92)"/>
    <ellipse cx="150" cy="118" rx="7" ry="4"/></g>` : '';
  const ag = Math.max(0, Math.min(1, s.agua||0));
  const GOTAS = [[60,52],[84,40],[112,38],[140,50],[48,84],[154,86],[70,116],[130,120],[100,34]];
  const agua = ag > 0.02 ? `
    <g opacity="${(0.85*ag).toFixed(2)}" fill="#7FC7F5">
      ${GOTAS.slice(0, Math.round(GOTAS.length*ag)).map(([x,y],i)=>
        `<ellipse cx="${x}" cy="${y}" rx="3" ry="5" opacity="${(0.5+((i%3)*0.15)).toFixed(2)}"/>`).join('')}
    </g>
    <g stroke="#9BD4FF" stroke-width="3" opacity="${(0.7*ag).toFixed(2)}" stroke-linecap="round">
      ${[54,74,96,120,142].map(x=>`<path d="M${x} 0 L${x-4} 26"/>`).join('')}
    </g>` : '';
  const ep = Math.max(0, Math.min(1, s.espuma||0));
  const BOLHAS = [[100,38,24],[70,52,20],[132,50,20],[86,64,18],[116,62,18],[52,74,16],[150,74,16],[100,84,14]];
  const MINI = [[40,110,8],[164,104,7],[30,60,6],[172,58,6]];
  const espuma = ep > 0.02 ? `
    <g fill="#FFFFFF" opacity=".95">
      ${BOLHAS.slice(0, Math.max(1, Math.round(BOLHAS.length*ep))).map(([x,y,r])=>
        `<circle cx="${x}" cy="${y}" r="${(r*(0.5+0.5*ep)).toFixed(1)}"/>`).join('')}
    </g>
    <g fill="#EAF6FF" opacity="${(0.9*ep).toFixed(2)}">
      ${MINI.slice(0, Math.round(MINI.length*ep)).map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}"/>`).join('')}
    </g>` : '';
  return `
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230"${tamanho?` width="${tamanho}" height="${Math.round(tamanho*230/200)}"`:''}>
  <rect width="200" height="230" rx="24" fill="${s.fundo}"/>
  <rect x="86" y="158" width="28" height="30" rx="10" fill="${s.pele}"/>
  <path d="M56 230 q0 -34 44 -40 q44 6 44 40 Z" fill="#7C6CF0"/>
  ${s.cabelo===1||s.cabelo===4 ? desenhoCabelo(s.cabelo, s.corCabelo) : ''}
  <ellipse cx="100" cy="108" rx="58" ry="68" fill="${s.pele}"/>
  <circle cx="42" cy="116" r="11" fill="${s.pele}"/>
  <circle cx="158" cy="116" r="11" fill="${s.pele}"/>
  ${s.cabelo===1||s.cabelo===4 ? capaCabelo(s.corCabelo) : desenhoCabelo(s.cabelo, s.corCabelo)}
  ${sombra}
  ${olho(70)}
  ${olho(130)}
  <path d="M100 118 q6 12 -2 16" stroke="rgba(0,0,0,.25)" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  ${blush}
  <path d="M78 150 q22 -8 44 0 q-22 22 -44 0Z" fill="${s.batom}"/>
  <path d="M78 150 q22 6 44 0" stroke="rgba(0,0,0,.18)" stroke-width="1.6" fill="none"/>
  ${sujeira}
  ${fios}
  ${acess}
  ${agua}
  ${espuma}
</svg>`;
}

    pele: PELES[0].h, cabelo:0, corCabelo: CORES_CABELO[1].h, corOlho: CORES_OLHO[0].h,
    batom: CORES_BATOM[1].h, blush: null, sombra: null, acess: null, fundo: CORES_FUNDO[0].h,

  };
}

const PASSOS_BANHO = [

  {id:'shampoo',  ico:'🧴', txt:'Passe o shampoo',     fala:'Agora esfregue o shampoo, fazendo bastante espuma!'},

];
const DISTANCIA_PASSO = 520;   // pixels de esfregada para completar um passo
let salaoFase = 'banho', banhoPasso = 0, esfregando = false, ultimoPonto = null,
    distanciaFeita = 0, ultimoSomAgua = 0;

/* ---------- pedidos variados ---------- */
function miniRosto(corte, tam, cor){
  const base = salao || novoVisual();
  const v = Object.assign({}, base, {
    cabelo: corte, corCabelo: cor || base.corCabelo,
    sujo:0, agua:0, espuma:0, bagunca:0, acess:null, fundo:'#F5F2FF'
  });
  return svgRosto(v, tam);
}
const cor2 = v => `<span class="cp-amostra" style="background:${v}"></span>`;
const emo2 = v => `<span class="cp-amostra emoji">${v}</span>`;
const ITENS_PEDIDO = [
  {id:'corCabelo', rotulo:'cor do cabelo', aba:'corCabelo', mostra:cor2,
   opcoes:()=>CORES_CABELO.map(c=>({v:c.h, n:'cabelo '+c.n}))},
  {id:'cabelo', rotulo:'corte', aba:'cabelo', mostra:v=>`<span class="cp-amostra corte">${miniRosto(v, 30, '#6B4226')}</span>`,
   opcoes:()=>ESTILOS_CABELO.map((e,i)=>({v:i, n:'corte '+e.n}))},
  {id:'batom', rotulo:'batom', aba:'batom', mostra:cor2,
   opcoes:()=>CORES_BATOM.map(c=>({v:c.h, n:'batom '+c.n}))},
  {id:'sombra', rotulo:'sombra', aba:'sombra', mostra:cor2,
   opcoes:()=>CORES_SOMBRA.filter(c=>c.h).map(c=>({v:c.h, n:'sombra '+c.n}))},
  {id:'blush', rotulo:'blush', aba:'blush', mostra:cor2,
   opcoes:()=>CORES_BLUSH.filter(c=>c.h).map(c=>({v:c.h, n:'blush '+c.n}))},
  {id:'corOlho', rotulo:'cor dos olhos', aba:'corOlho', mostra:cor2,
   opcoes:()=>CORES_OLHO.map(c=>({v:c.h, n:'olhos '+c.n}))},
  {id:'acess', rotulo:'enfeite', aba:'acess', mostra:emo2,
   opcoes:()=>ACESSORIOS.filter(a=>a.e).map(a=>({v:a.e, n:a.n+' '+a.e}))},
  {id:'fundo', rotulo:'fundo', aba:'fundo', mostra:cor2,
   opcoes:()=>CORES_FUNDO.map(c=>({v:c.h, n:'fundo '+c.n}))},
  {id:'pele', rotulo:'tom de pele', aba:'pele', mostra:cor2,
   opcoes:()=>PELES.map(c=>({v:c.h, n:'pele '+c.n}))}
];
let filaPedidos = [];

function sortearPedido(){
  const quantos = salaoDificil ? 3 : 2;
  if(filaPedidos.length < quantos) filaPedidos = embaralhar(ITENS_PEDIDO.map(i=>i.id));
  const ids = filaPedidos.splice(0, quantos);
  return ids.map(id=>{
    const item = ITENS_PEDIDO.find(i=>i.id===id);
    const possiveis = item.opcoes().filter(o=>o.v !== salao[id]);
    const alvo = escolha(possiveis.length ? possiveis : item.opcoes());
    const aba = ABAS.find(x=>x.id===item.aba);
    return {id, aba:item.aba, rotulo:item.rotulo, valor:alvo.v, nome:alvo.n,
            ico:(aba?aba.ico:'✨'), amostra:item.mostra(alvo.v)};
  });
}

/* ---------- ciclo do jogo ---------- */
function jogoSalao(dificil){
  salaoDificil = dificil;
  salaoCliente = 0;
  maxPontos = 5;
  totalRodadas = 5;
  salao = novoVisual();
  salaoAba = 'cabelo';
  filaPedidos = [];
  $('#palco').className = 'palco compacto';
  $('#palco').innerHTML = `
    <div class="pedido" id="pedido"></div>
    <div class="salao" id="salaoBox"></div>`;
  novoCliente();
}

function novoCliente(){
  salaoPedido = { itens: sortearPedido() };
  salaoPedido.texto = salaoPedido.itens.map(i=>`<b>${i.nome}</b>`).join(' + ');
  const fala = 'Oi! Depois do banho eu quero ' +
    salaoPedido.itens.map(i=>i.nome).join(', e ') + ', por favor.';
  salao.sujo = 1; salao.agua = 0; salao.espuma = 0; salao.bagunca = 1;
  salaoFase = 'banho'; banhoPasso = 0; distanciaFeita = 0;
  falar(fala);
  desenharSalao();
}

function progressoAtual(){
  const p = PASSOS_BANHO[banhoPasso];
  if(!p) return 1;
  if(p.id === 'molhar')   return salao.agua;
  if(p.id === 'shampoo')  return salao.espuma;
  if(p.id === 'enxaguar') return 1 - salao.espuma;
  if(p.id === 'secar')    return 1 - salao.agua;
  return 1 - salao.bagunca;
}

function cabecalhoPedido(){
  const p = $('#pedido'); if(!p) return;
  if(salaoFase === 'banho'){
    p.innerHTML = `<span class="cliente-tag">🛁 ${salaoCliente+1}/5</span>
      <span class="cp-texto"><b>Hora do banho!</b></span>`;
    return;
  }
  const feito = i => salao[i.id] === i.valor;
  p.innerHTML = `<span class="cliente-tag">👧 ${salaoCliente+1}/5</span>
    <span class="cp-texto">quero assim:</span>
    <span class="pedido-chips">${salaoPedido.itens.map((i,k)=>`
      <button class="chip-pedido${feito(i)?' ok':''}" data-k="${k}" title="${esc(i.nome)}">
        <span class="cp-ico">${i.ico}</span>${i.amostra}
        <span class="cp-nome">${esc(i.nome)}</span>
        <span class="cp-check">${feito(i)?'✅':''}</span>
      </button>`).join('')}</span>`;
  p.querySelectorAll('.chip-pedido').forEach(b=>b.onclick=()=>{
    somToque();
    salaoAba = salaoPedido.itens[+b.dataset.k].aba;
    desenharSalao();
  });
}

function desenharSalao(){
  cabecalhoPedido();
  const box = $('#salaoBox'); if(!box) return;

  if(salaoFase === 'banho'){
    const passo = PASSOS_BANHO[banhoPasso];
    const pct = Math.round(Math.max(0, Math.min(1, progressoAtual()))*100);
    box.innerHTML = `
      <div class="passos-banho">${PASSOS_BANHO.map((p,i)=>
        `<span class="bolinha${i<banhoPasso?' feito':''}${i===banhoPasso?' agora':''}">${p.ico}</span>`).join('')}</div>
      <div class="area-banho" id="areaBanho">
        <div class="rosto" id="rosto"></div>
        <span class="ferramenta" id="ferramenta">${passo.ico}</span>
      </div>
      <div class="instrucao-banho">${passo.ico} ${passo.txt} — <b>esfregue com o dedo!</b></div>
      <div class="barra-banho"><i id="barraBanho" style="width:${pct}%"></i></div>
      <button class="btn2" id="btnRefazerBanho">🔄 Refazer banho</button>`;
    $('#rosto').innerHTML = svgRosto(salao);
    ligarEsfregar();
    $('#btnRefazerBanho').onclick = ()=>{
      somToque();
      salao.sujo = 1; salao.agua = 0; salao.espuma = 0; salao.bagunca = 1;
      banhoPasso = 0; distanciaFeita = 0;
      falar('Vamos começar o banho de novo!', false);
      desenharSalao();
    };
    return;
  }

  box.innerHTML = `
    <div class="rosto" id="rosto"></div>
    <div class="abas" id="abas"></div>
    <div class="opcoesSalao" id="opcoesSalao"></div>
    <div class="linha-botoes">
      <button class="btn2" id="btnPronto">✨ Pronto!</button>
      <button class="btn2" id="btnRefazer">🔄 Refazer</button>
      <button class="btn2" id="btnFoto">📷 Salvar</button>
      <button class="btn2" id="btnBanhoDeNovo">🛁 Banho</button>
    </div>`;
  $('#rosto').innerHTML = svgRosto(salao);
  $('#btnPronto').onclick = conferirVisual;
  $('#btnFoto').onclick = salvarFoto;
  $('#btnRefazer').onclick = ()=>{
    if(bloqueado) return;
    somToque();
    const limpo = novoVisual();
    Object.keys(limpo).forEach(k=>{ if(!['sujo','agua','espuma','bagunca'].includes(k)) salao[k] = limpo[k]; });
    aviso('Tudo apagado! 🔄', true);
    falar('Apaguei tudo. Pode começar de novo!', false);
    desenharSalao();
  };
  $('#btnBanhoDeNovo').onclick = ()=>{
    if(bloqueado) return;
    somToque();
    salao.agua = 0; salao.espuma = 0; salao.bagunca = 1;
    salaoFase = 'banho'; banhoPasso = 0; distanciaFeita = 0;
    falar('Mais um banho? Vamos lá!', false);
    desenharSalao();
  };

  $('#abas').innerHTML = ABAS.map(a=>{
    const pedido = salaoPedido.itens.some(i=>i.aba===a.id);
    return `<button class="aba${a.id===salaoAba?' on':''}${pedido?' pedida':''}" data-aba="${a.id}">${a.ico} ${a.nome}</button>`;
  }).join('');
  $('#abas').querySelectorAll('.aba').forEach(b=>b.onclick=()=>{ salaoAba=b.dataset.aba; somToque(); desenharSalao(); });

  const cont = $('#opcoesSalao');
  const cores = (lista, chave)=> lista.map(c=>
    `<button class="chip-cor${salao[chave]===c.h?' on':''}" data-chave="${chave}" data-valor="${c.h||''}"
       title="${c.n}" aria-label="${c.n}"
       style="background:${c.h || 'repeating-linear-gradient(45deg,#eee 0 6px,#fff 6px 12px)'}"></button>`).join('');

  if(salaoAba === 'cabelo'){
    cont.innerHTML = ESTILOS_CABELO.map((e,i)=>
      `<button class="chip-est corte${salao.cabelo===i?' on':''}" data-chave="cabelo" data-valor="${i}" title="${e.n}" aria-label="${e.n}">${miniRosto(i, 54)}</button>`).join('');
  }else if(salaoAba === 'acess'){
    cont.innerHTML = ACESSORIOS.map(a=>
      `<button class="chip-est${salao.acess===(a.e||null)?' on':''}" data-chave="acess" data-valor="${a.e||''}" title="${a.n}">${a.e||'🚫'}</button>`).join('');
  }else if(salaoAba === 'pele')      cont.innerHTML = cores(PELES,'pele');
  else if(salaoAba === 'corCabelo')  cont.innerHTML = cores(CORES_CABELO,'corCabelo');
  else if(salaoAba === 'corOlho')    cont.innerHTML = cores(CORES_OLHO,'corOlho');
  else if(salaoAba === 'batom')      cont.innerHTML = cores(CORES_BATOM,'batom');
  else if(salaoAba === 'sombra')     cont.innerHTML = cores(CORES_SOMBRA,'sombra');
  else if(salaoAba === 'blush')      cont.innerHTML = cores(CORES_BLUSH,'blush');
  else                                cont.innerHTML = cores(CORES_FUNDO,'fundo');

  cont.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const chave = b.dataset.chave, v = b.dataset.valor;
    salao[chave] = chave==='cabelo' ? +v : (v || null);
    somToque();
    desenharSalao();
  });
}

/* ---------- esfregar ---------- */
function ligarEsfregar(){
  const area = $('#areaBanho'); if(!area) return;
  const ferramenta = $('#ferramenta');

  const posicao = ev=>{
    const r = area.getBoundingClientRect();
    return {x: ev.clientX - r.left, y: ev.clientY - r.top};
  };
  const inicio = ev=>{
    if(bloqueado) return;
    ev.preventDefault();
    try{ area.setPointerCapture(ev.pointerId); }catch(e){}
    esfregando = true;
    ultimoPonto = posicao(ev);
    ferramenta.classList.add('ativa');
    mostrarFerramenta(ultimoPonto);
    avancarBanho(70);          // um toque simples já rende um pouquinho
  };
  const mover = ev=>{
    const p = posicao(ev);
    mostrarFerramenta(p);
    if(!esfregando || !ultimoPonto) return;
    ev.preventDefault();
    const d = Math.min(60, Math.hypot(p.x-ultimoPonto.x, p.y-ultimoPonto.y));
    ultimoPonto = p;
    if(d > 1) avancarBanho(d);
  };
  const fim = ()=>{ esfregando = false; ultimoPonto = null; ferramenta.classList.remove('ativa'); };

  function mostrarFerramenta(p){
    ferramenta.style.left = p.x + 'px';
    ferramenta.style.top  = p.y + 'px';
  }

  area.addEventListener('pointerdown', inicio);
  area.addEventListener('pointermove', mover);
  area.addEventListener('pointerup', fim);
  area.addEventListener('pointercancel', fim);
}

function avancarBanho(dist){
  const passo = PASSOS_BANHO[banhoPasso];
  if(!passo || bloqueado) return;
  const passoFrac = dist / DISTANCIA_PASSO;

  if(passo.id === 'molhar'){
    salao.agua = Math.min(1, salao.agua + passoFrac);
    salao.sujo = Math.max(0.45, salao.sujo - passoFrac*0.4);
  }else if(passo.id === 'shampoo'){
    salao.espuma = Math.min(1, salao.espuma + passoFrac);
    salao.sujo = Math.max(0, salao.sujo - passoFrac*1.3);
  }else if(passo.id === 'enxaguar'){
    salao.espuma = Math.max(0, salao.espuma - passoFrac);
    salao.sujo = 0;
  }else if(passo.id === 'secar'){
    salao.agua = Math.max(0, salao.agua - passoFrac);
  }else{
    salao.bagunca = Math.max(0, salao.bagunca - passoFrac);
  }

  // som contínuo enquanto esfrega
  const agora = performance.now();
  if(agora - ultimoSomAgua > 320){
    ultimoSomAgua = agora;
    if(passo.id === 'molhar' || passo.id === 'enxaguar') somRuido(0.35, 2600, 0.09);
    else if(passo.id === 'shampoo') somRuido(0.35, 900, 0.08);
    else if(passo.id === 'secar') somRuido(0.35, 700, 0.10);
    else somPente();
  }

  $('#rosto').innerHTML = svgRosto(salao);
  const barra = $('#barraBanho');
  if(barra) barra.style.width = Math.round(Math.max(0, Math.min(1, progressoAtual()))*100) + '%';

  if(progressoAtual() >= 0.995) concluirPasso();
}

function concluirPasso(){
  const passo = PASSOS_BANHO[banhoPasso];
  if(passo.id === 'molhar') salao.agua = 1;
  if(passo.id === 'shampoo') salao.espuma = 1;
  if(passo.id === 'enxaguar'){ salao.espuma = 0; salao.sujo = 0; confete(8); }
  if(passo.id === 'secar') salao.agua = 0;
  if(passo.id === 'pentear') salao.bagunca = 0;

  banhoPasso++;
  esfregando = false; ultimoPonto = null;
  somAcerto();

  if(banhoPasso >= PASSOS_BANHO.length){
    salaoFase = 'visual';
    confete(18);
    aviso('Limpinha e penteada! ✨', true);
    falar('Prontinho, limpinha e penteada! Agora o visual.', false, 'festa');
  }else{
    falar(PASSOS_BANHO[banhoPasso].fala, false);
  }
  desenharSalao();
}

async function conferirVisual(){
  if(bloqueado) return;
  somToque();
  const faltas = salaoPedido.itens.filter(i=>salao[i.id] !== i.valor);

  if(faltas.length){
    errou();
    aviso('Faltou: ' + faltas[0].nome, false);
    falar('Ainda falta ' + faltas.map(f=>f.nome).join(' e ') + '.', false, 'calmo');
    // leva direto para a aba do que falta
    salaoAba = faltas[0].aba;
    desenharSalao();
    return;
  }
  bloqueado = true;
  acertou('Ficou lindo!');
  confete(26);
  salaoCliente++;
  rodada = salaoCliente;
  atualizaPlacar();
  await espera(1600);
  bloqueado = false;
  if(salaoCliente >= 5){ fimDeJogo(); return; }
  novoCliente();
}

function salvarFoto(){
  somToque();
  try{
    const svg = svgRosto(salao);
    const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    const img = new Image();
    img.onload = ()=>{
      const cv = document.createElement('canvas');
      cv.width = 600; cv.height = 690;
      const c = cv.getContext('2d');
      c.drawImage(img, 0, 0, 600, 690);
      const a = document.createElement('a');
      a.download = 'meu-visual.png';
      a.href = cv.toDataURL('image/png');
      a.click();
      aviso('Foto salva! 📷', true);
    };
    img.onerror = ()=>aviso('Não deu para salvar', false);
    img.src = url;
  }catch(e){ aviso('Não deu para salvar', false); }
}
