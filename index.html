// bonequinho pendurado na barra como quem brinca no trapézio (nada sombrio)
function desenhoForca(erros){
  const t = '#6B4226';
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <rect width="200" height="200" fill="#F7F4FF" rx="18"/>
    <rect x="26" y="168" width="120" height="12" rx="6" fill="${t}"/>
    <rect x="46" y="34" width="12" height="140" rx="6" fill="${t}"/>
    <rect x="46" y="28" width="98" height="12" rx="6" fill="${t}"/>
    <rect x="136" y="34" width="7" height="26" rx="3.5" fill="#B98B5E"/>`;
  if(erros >= 1) s += `<circle cx="139" cy="80" r="20" fill="#FFD9A8" stroke="#C79A6B" stroke-width="3"/>
    <circle cx="132" cy="77" r="2.6" fill="#3A2B20"/><circle cx="146" cy="77" r="2.6" fill="#3A2B20"/>
    <path d="M131 88 q8 7 16 0" stroke="#3A2B20" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  if(erros >= 2) s += `<rect x="131" y="99" width="16" height="42" rx="8" fill="#5B8DEF"/>`;
  if(erros >= 3) s += `<path d="M133 104 L120 74" stroke="#FFD9A8" stroke-width="8" stroke-linecap="round"/>`;
  if(erros >= 4) s += `<path d="M145 104 L158 74" stroke="#FFD9A8" stroke-width="8" stroke-linecap="round"/>`;
  if(erros >= 5) s += `<path d="M134 140 L126 168" stroke="#3F51B5" stroke-width="9" stroke-linecap="round"/>`;
  if(erros >= 6) s += `<path d="M144 140 L152 168" stroke="#3F51B5" stroke-width="9" stroke-linecap="round"/>`;
  return s + '</svg>';
}

function jogoForca(){
  maxPontos = 6; totalRodadas = 6;
  forcaJaSorteadas = [];
  $('#palco').className = 'palco compacto';
  novaPalavraForca();
}
function novaPalavraForca(){
  let pool = PALAVRAS_FORCA.filter(w=>!forcaJaSorteadas.includes(w.p));
  if(!pool.length){ forcaJaSorteadas = []; pool = PALAVRAS_FORCA; }
  forcaAlvo = escolha(pool);
  forcaJaSorteadas.push(forcaAlvo.p);
  forcaUsadas = []; forcaErros = 0;
  $('#palco').innerHTML = `
    <div class="pergunta">Adivinhe a palavra</div>
    <div class="pedido" id="dicaForca">Dica: <b>${forcaAlvo.d}</b> — palavra ${rodada+1} de 6</div>
    <div class="forca-area">
      <div class="forca-desenho" id="desenhoForca"></div>
      <div class="forca-lado">
        <div class="palavraForca" id="palavraForca"></div>
        <div class="vidasForca" id="vidasForca"></div>
      </div>
    </div>
    <div class="teclado" id="teclado"></div>`;
  desenharForca();
  falar(`Adivinhe a palavra. A dica é: ${forcaAlvo.d}.`);
}
function desenharForca(){
  $('#desenhoForca').innerHTML = desenhoForca(forcaErros);
  $('#palavraForca').innerHTML = forcaAlvo.p.split('').map(l=>
    `<span class="slotForca${forcaUsadas.includes(l)?' cheio':''}">${forcaUsadas.includes(l)?l:''}</span>`).join('');
  $('#vidasForca').innerHTML = '❤️'.repeat(MAX_ERROS - forcaErros) + '🤍'.repeat(forcaErros);
  $('#teclado').innerHTML = ALFABETO.map(l=>{
    const usada = forcaUsadas.includes(l);
    const cls = usada ? (forcaAlvo.p.includes(l) ? 'tecla ok' : 'tecla nao') : 'tecla';
    return `<button class="${cls}" data-l="${l}" ${usada?'disabled':''}>${l}</button>`;
  }).join('');
  $('#teclado').querySelectorAll('.tecla').forEach(b=>b.onclick=()=>chutarLetra(b.dataset.l));
}
async function chutarLetra(l){
  if(bloqueado || forcaUsadas.includes(l)) return;
  somToque();
  forcaUsadas.push(l);
  const tem = forcaAlvo.p.includes(l);
  if(!tem) forcaErros++;
  desenharForca();

  const completou = forcaAlvo.p.split('').every(c=>forcaUsadas.includes(c));
  if(completou){
    bloqueado = true;
    acertou(`A palavra era ${forcaAlvo.p}.`);
    confete(20);
    rodada++; atualizaPlacar();
    await espera(1700);
    bloqueado = false;
    if(rodada >= totalRodadas){ fimDeJogo(); return; }
    novaPalavraForca();
    return;
  }
  if(!tem){
    if(forcaErros >= MAX_ERROS){
      bloqueado = true;
      somErro(); aviso(`Era ${forcaAlvo.p}!`, false);
      falar(`A palavra era ${forcaAlvo.p}. Vamos para a próxima!`, false, 'calmo');
      // mostra a palavra inteira antes de seguir
      forcaUsadas = [...new Set([...forcaUsadas, ...forcaAlvo.p.split('')])];
      desenharForca();
      rodada++; atualizaPlacar();
      await espera(2400);
      bloqueado = false;
      if(rodada >= totalRodadas){ fimDeJogo(); return; }
      novaPalavraForca();
    }else{
      errou();
    }
  }
}

/* ============ fluxo ============ */
function abrirMenu(grupo){
  grupoAtual = grupo;
  $('#tituloMenu').textContent = grupo==='p' ? '🧸 5 a 7 anos' : '🚀 8 a 11 anos';
  $('#cartoes').innerHTML = CATALOGO.filter(j=>j.g===grupo).map(j=>`
    <button class="cartao ${j.cor}" data-jogo="${j.id}">
      <span class="ico">${j.ico}</span>
      <span class="nome">${j.nome}</span>
      <span class="desc">${j.desc}</span>
    </button>`).join('');
  $('#cartoes').querySelectorAll('.cartao').forEach(c=>{
    c.onclick = ()=>{ audio(); somToque(); iniciarJogo(c.dataset.jogo); };
  });
  mostrarTela('menu');
}
function iniciarJogo(id){
  const j = porId(id); if(!j) return;
  limparTimers();
  $('#palco').className = 'palco';
  jogoAtual = id; rodada = 0; estrelas = 0; bloqueado = false;
  totalRodadas = j.rodadas || (j.g === 'g' ? 10 : 8);
  maxPontos = totalRodadas;
  $('#tituloJogo').textContent = j.ico + ' ' + j.nome;
  atualizaPlacar();
  mostrarTela('jogo');
  j.fn();
}
function proximaRodada(){
  if(rodada >= totalRodadas){ fimDeJogo(); return; }
  porId(jogoAtual).fn();
}
function fimDeJogo(){
  limparTimers();
  const max = maxPontos;
  $('#fimTexto').textContent = `Você ganhou ${estrelas} ${estrelas===1?'estrela':'estrelas'} de ${max}! ⭐`;
  $('#fimTitulo').textContent = estrelas>=max ? 'Perfeito!' : 'Muito bem!';
  mostrarTela('fim');
  somFesta(); confete(50);
  falar(estrelas>=max ? 'Perfeito! Você acertou tudo! Parabéns!' : 'Muito bem! Você conseguiu!', false, 'festa');
}
